[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "atelier-2"
version = "0.0.0"
requires-python = "==3.12.3"
dependencies = [
    "dbos==2.29.0",
    "fastapi==0.141.1",
    "pydantic==2.13.4",
    "pyyaml==6.0.3",
    "sqlalchemy==2.0.51",
    "uvicorn==0.52.1",
]

[project.scripts]
atelier2 = "atelier2.host:main"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "openapi-spec-validator==0.9.0",
    "pytest==9.1.1",
    "pytest-xdist==3.8.0",
    "pyright==1.1.411",
    "ruff==0.16.2",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
pythonpath = ["src"]

[tool.pyright]
extraPaths = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/atelier2"]
