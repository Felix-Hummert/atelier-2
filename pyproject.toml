[project]
name = "atelier-2"
version = "0.0.0"
requires-python = "==3.12.3"
dependencies = [
    "dbos==2.29.0",
    "pydantic==2.13.4",
    "pyyaml==6.0.3",
    "sqlalchemy==2.0.51",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-xdist==3.8.0",
    "pyright==1.1.411",
    "ruff==0.16.2",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
pythonpath = ["src"]

[tool.pyright]
extraPaths = ["src"]
