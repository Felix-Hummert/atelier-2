# why: our exhaustive `match`/`case` style deliberately falls through to the code
# after the match with `pass` when a matched case needs no special handling
# (assert_never covers the unreachable arm); the one non-match hit is a
# side-effecting `while condition(): pass` retry loop. Neither is missing code.
sonar.issue.ignore.multicriteria.e19.ruleKey=python:S108
sonar.issue.ignore.multicriteria.e19.resourceKey=src/**

# why: every hit names a specific expected exception (UnicodeDecodeError,
# binascii.Error, json.JSONDecodeError, OperationalError/PoolTimeoutError, etc.)
# alongside a broader type already in the same tuple, as documentation of what
# the catch is for; the broader type would already catch it, so this is
# self-documentation, not a masked or duplicated catch (checked all 38 hits).
sonar.issue.ignore.multicriteria.e20.ruleKey=python:S5713
sonar.issue.ignore.multicriteria.e20.resourceKey=src/**

# why: this file's cleanup handlers deliberately catch BaseException per
# resource so one failing close() does not skip the rest, collect the errors,
# then re-raise them together (bare `raise` or `BaseExceptionGroup`) after all
# cleanup ran; a caught SystemExit is still re-raised, just from the
# aggregating statement further down rather than the same except block Sonar
# checks (checked all 9 hits, all in this one file).
sonar.issue.ignore.multicriteria.e21.ruleKey=python:S5754
sonar.issue.ignore.multicriteria.e21.resourceKey=src/atelier2/adapters/dbos/runtime.py

# why: our style builds a `pytest.raises` block's argument via a nested call
# inside the one statement under test (arrange, not a second action); an AST
# check of all 342 hits found exactly one file with a real exception: 2 hits in
# tests/integration/test_runner_journal.py (lines 100, 106) hold two genuine
# top-level statements each, where the intended call under test
# (journal.acknowledge/.release) never runs because require_matching_evidence_hash
# raises first -- a real test bug, not covered by this rationale, listed for the
# audit distributor (#1203) as its own small follow-up; Sonar's ignore criteria
# have no line-level exclusion, so this broad ignore also silences those 2 until
# the test itself is fixed.
sonar.issue.ignore.multicriteria.e22.ruleKey=python:S5778
sonar.issue.ignore.multicriteria.e22.resourceKey=tests/**
