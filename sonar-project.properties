sonar.organization=overnightworks
sonar.projectKey=overnightworks_atelier-2
sonar.sources=src,frontend/src
sonar.tests=tests,frontend/tests
sonar.exclusions=frontend/dist/**,frontend/build/**,frontend/.svelte-kit/**,docs/requirements/**/*.html,**/*.min.js
# why: openapi_frozen.json is a generated API-contract snapshot, not authored test code
sonar.test.exclusions=tests/api/openapi_frozen.json
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8

# The `sonar` job in .github/workflows/ci.yml downloads these from the
# `quality` and `frontend` jobs' report artifacts before scanning (#1203).
sonar.python.coverage.reportPaths=reports/coverage.xml
sonar.javascript.lcov.reportPaths=reports/frontend-coverage/lcov.info

# Rule classes that do not fit this project (#1203 triage). Each entry names why.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,e11,e12,e13,e14,e15,e16,e17,e18,e19,e20,e21,e22

# why: uv on a local project with its own build backend cannot pass --no-build
sonar.issue.ignore.multicriteria.e1.ruleKey=githubactions:S8541
sonar.issue.ignore.multicriteria.e1.resourceKey=.github/workflows/**

# why: uv on a local project with its own build backend cannot pass --only-binary :all:
sonar.issue.ignore.multicriteria.e2.ruleKey=docker:S8541
sonar.issue.ignore.multicriteria.e2.resourceKey=**/Dockerfile*

# why: witness Dockerfiles pin the runner image by digest at build time, not via a lockfile the scanner can see
sonar.issue.ignore.multicriteria.e3.ruleKey=docker:S8544
sonar.issue.ignore.multicriteria.e3.resourceKey=**/Dockerfile*

# why: uv on a local project with its own build backend cannot pass --no-build
sonar.issue.ignore.multicriteria.e4.ruleKey=shell:S8541
sonar.issue.ignore.multicriteria.e4.resourceKey=scripts/**/*.sh

# why: uv on a local project with its own build backend cannot pass --ignore-scripts
sonar.issue.ignore.multicriteria.e5.ruleKey=shell:S6505
sonar.issue.ignore.multicriteria.e5.resourceKey=scripts/**/*.sh

# why: SHA-256 here is a content-identity fingerprint, not a password digest
sonar.issue.ignore.multicriteria.e6.ruleKey=python:S4790
sonar.issue.ignore.multicriteria.e6.resourceKey=src/atelier2/contracts/effect_requests.py

# why: loopback URL, not a network-exposed endpoint
sonar.issue.ignore.multicriteria.e7.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.e7.resourceKey=src/atelier2/host/address.py

# why: loopback URL, not a network-exposed endpoint
