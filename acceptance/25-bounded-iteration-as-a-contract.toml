schema_version = 1
story = "https://github.com/FlexOr2/atelier-2/issues/25"

# This file does not list every sentence of #25, and that is deliberate.
#
# ADR 0013's `iterate` surface parses as a closed model and remains declarable,
# readable and unexecutable: the real starter refuses a `subworkflow` node before
# any run, configuration or enqueue write. #449 withdrew the tests-only child
# binding sentences and their proof markers.
#
# The fourth head is the engine, under ADR 0014 and the operator rulings of
# 19.08.: a document declares a loop over a stretch of *its own* graph, and the
# engine turns its rounds with an identity each round owns. The five sentences it
# proves are the five before the verdict block below.
#
# The fifth head is ADR 0015: the answer a round produced steers the loop's back
# edge. Its five sentences are the last five below, and what it deliberately does
# not build is named rather than implied. The **agent's own named refusal** is
# still unbuilt, and now for a measured reason rather than for lack of a turn: a
# run ends failed only under an attempt failure code whose value list is a closed
# store contract, mirrored in the published schema shapes, the migration ladder,
# the wire and the frontend. Writing a refusal under either existing code would
# say a schema refused what no schema saw, or that a process died that exited
# cleanly, so the door waits for a store hop of its own. The V1 merge node and the
# `binding_constraint` the operator ruled on 19.08. are a further, thinner cut on
# existing machinery. The constraint sentences below claim that cut.
#
# Six sentences of #25 therefore have no proof of any kind here and are named
# rather than quietly dropped:
#
#   5.  Green is read from the round's own receipt and its declared artifact,
#       never from an agent's claim. Needs #63's artifact row and the instance
#       evaluator ADR 0013 names as #57's -- none exists in `src` today.
#   6.  An iteration that reaches its bound without green ends in exactly one
#       terminal receipt naming the node, the bound and the last round's
#       disposition. The durable token is #16's to mint.
#   7.  Round K+1 reads round K's result, and every round is its own unrolled
#       stage of the durable truth. The input-edge half is #402
#       (`a-later-round-reads-the-previous-rounds-output`). The join/scheduler
#       half stays with the V3 Join/Ready/Scheduler owner ADR 0008 names.
#
# Two forms now say "repeat, at most N times" -- ADR 0013's authored `iterate`
# and ADR 0014's in-graph loop. ADR 0014 names that seam and leaves it open for
# usage evidence rather than retiring either by guess. Neither counts as the
# other's proof.
#
# #449 withdrew the former binding-head claims; no current sentence treats a
# child-bound refusal as proof.
#
# A further sentence was retired on 01.09.2026 (#450, operator ruling of
# 30.08.2026: "die Insel wird abgerissen"):
#
#   "the-preview-names-every-iteration-with-its-bound-and-its-green" -- it
#   promised that a preview names every iteration node with its bound and its
#   green condition before a start. The composed preview it spoke of reached no
#   entry point of this build: `application/compose_preview.py`,
#   `contracts/composed_preview_v3.py` and `contracts/capabilities_v3.py` lived
#   only through domain tests since #83 and were deleted rather than wired, so
#   the surface the sentence measured does not exist. Its former proof,
#   `tests/domain/test_composed_preview_v3.py`, is retired with it. That the
#   authored bound and green condition read back exactly as written, and that an
#   unbound or contradicted one is refused by name, stays declared above. ADR
#   0013's sentence that the preview names them before a start is thereby
#   unclaimed, and belongs to whichever surface first draws a run before it runs.

[[sentence]]
id = "a-bounded-iteration-is-declarable-and-reads-back-as-authored"
text = "A subworkflow node may declare a bounded iteration, and the parsed document reads back its round bound, its green condition and its round handover exactly as authored; a subworkflow that declares none has no iteration."

[[sentence]]
id = "an-iteration-without-a-bound-is-refused-by-name"
text = "A declared iteration whose maximum number of rounds is absent, or is anything other than a whole positive count within the declared range, is refused by name before the document can be stored, published or started."

[[sentence]]
id = "a-green-condition-the-document-contradicts-is-refused-by-name"
text = "A green condition that reads a result under a different schema revision than the same node declares for it is refused by name."

[[sentence]]
id = "a-round-handover-unbound-in-the-document-is-refused-by-name"
text = "A round handover without a seed for the first round, declared twice, or seeded from something the document does not order before this node and declare, is refused by name."

[[sentence]]
id = "iteration-is-refused-on-a-node-kind-that-cannot-carry-it"
text = "A node kind that runs no child of its own is refused by name when it declares an iteration, rather than carrying a field it could never honour."

[[sentence]]
id = "a-loop-over-a-stretch-of-the-graph-is-declarable"
text = "A workflow document may declare that a stretch of its own graph repeats, naming the loop, the nodes it repeats and the maximum number of rounds, and the parsed document reads it back exactly as authored; a document that declares no loop repeats nothing."

[[sentence]]
id = "a-loop-without-a-bound-is-refused-by-name"
text = "A declared loop whose maximum number of rounds is absent, or is anything other than a whole positive count within the declared range, is refused by name before the document can be stored, published or started."

[[sentence]]
id = "a-loop-the-graph-cannot-turn-is-refused-by-name"
text = "A loop is refused by name when it repeats a node the document does not declare, when its body is not one uninterrupted stretch of the order the declared edges already give, when two loops claim the same node or the same id; and a control edge pointing backwards stays refused as the cycle it is, so the declaration remains the only legal way back."

[[sentence]]
id = "a-declared-loop-runs-its-rounds-and-ends-at-its-bound"
text = "A started run whose document declares a loop runs the loop's body again from its first node while rounds remain, and ends when the declared bound is reached — through the terminal path every other node ends by, with no word invented for it."

[[sentence]]
id = "every-round-of-a-loop-is-its-own-durable-execution"
text = "Every round of every looped node is its own node execution: its own deterministic identity, its own durable request, receipt, produced value and durable workflow, and its own event in the chain the terminal hash recomputes over — while the first round of a node keeps byte-for-byte the identity it had before any loop existed."

[[sentence]]
id = "a-loop-may-declare-the-verdict-that-sends-it-round-again"
text = "A declared loop may name the node whose verdict decides its continuation and the verdict that sends it round again, and the parsed document reads both back exactly as authored; a loop that declares none steers nothing and repeats until its bound."

[[sentence]]
id = "a-verdict-the-loop-could-not-read-is-refused-by-name"
text = "A loop's verdict condition is refused by name before anything is stored when it reads a node other than the one whose completion closes the round, when that node's one declared output does not pin the published verdict contract, or when the verdict it names is outside the closed vocabulary."

[[sentence]]
id = "a-declared-verdict-ends-a-loop-before-its-bound"
text = "A started run whose loop declares a verdict ends that loop in the round whose own answer says so — every earlier round having run in full and every later one leaving no receipt, value or attempt behind — while a verdict that keeps asking for another round still ends at the declared bound."

[[sentence]]
id = "the-continuation-a-verdict-steers-is-read-from-what-the-round-kept"
text = "The continuation a verdict steers is decided from the value that round durably kept, so a driver recovering after the round succeeded reaches the same edge; a loop a verdict steers is never continued without one."

[[sentence]]
id = "the-verdict-vocabulary-and-its-published-contract-are-one-owner"
text = "The verdict vocabulary and the published contract an answer carrying a verdict is judged by are one owner: every verdict this product owns is admitted by that contract, and bytes it does not admit never reach an edge."

[[sentence]]
id = "a-node-may-declare-a-named-agent-refusal"
text = "An agent node's output may declare a refusal form whose reason sentence is required, and the parsed document reads that declaration back; a node that declares none has no refusal door."

[[sentence]]
id = "a-declared-refusal-ends-the-attempt-as-agent-refused"
text = "When a node declared the refusal form and the executor answers with that form, the attempt ends FAILED under AGENT_REFUSED, the node receipt carries the agent's reason, and the run ends FAILED on the same node with no retry."

[[sentence]]
id = "success-and-schema-refusal-stay-the-same-when-refusal-is-undeclared"
text = "A node that did not declare a refusal still treats refusal-shaped bytes as a schema miss when its success schema refuses them, and a node that declared a refusal still accepts bytes its success schema admits."

[[sentence]]
id = "a-node-may-declare-it-must-not-share-another-nodes-binding"
text = "An agent node may declare binding_constraint.distinct_from naming another agent node of a different role, and the parsed document reads that declaration back exactly as authored; a node that declares none is unchecked."

[[sentence]]
id = "a-distinct-from-the-document-cannot-honour-is-refused-by-name"
text = "A distinct_from that names no declared node, this node, a node without an agent binding, or a node that shares this role is refused by name before the document is stored, published or started."

[[sentence]]
id = "the-same-occupation-is-refused-before-any-process"
text = "A start whose distinct_from pair resolves to the same agent configuration revision is refused by name before any run row or process exists, and the refusal names both nodes."

[[sentence]]
id = "different-occupations-start-and-an-undeclared-constraint-is-silent"
text = "A start whose distinct_from pair resolves to different agent configuration revisions creates the run; a document that declares no constraint starts even when two nodes share one occupation."
