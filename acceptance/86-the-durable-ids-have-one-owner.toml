schema_version = 1
story = "https://github.com/FlexOr2/atelier-2/issues/86"

# Three sentences from two of three heads. What is still owed is named rather
# than declared early:
#
#   - Head 1 also gives the DBOS names and the DBOS workflow ids one owner each.
#     That half has no sentence here, because a table of vectors proves the
#     *forms* and not the *ownership*: a call site that mints its own id again
#     would keep this table green. The machine guard that would close it belongs
#     to #11's gate module, and declaring the half before that guard exists is
#     exactly the mistake #88 recorded against itself.
#   - Head 2 (no function-local import, acyclic adapter package) carries its own
#     sentence when it lands. Two `effect_store -> run_store` hiding places stand
#     until then.
#   - Head 3 moved the decision and the request composition into the core. What
#     it did NOT build has no sentence: "decision and enqueue as one port" is
#     adopted here as ownership, and only the decision half has a caller today --
#     nothing in the core enqueues, so no port was invented for the other half.

[[sentence]]
id = "every-durable-workflow-id-keeps-its-exact-form-when-its-owner-moves"
text = "All ten durable identities this engine mints - bootstrap, node, answer, subworkflow, logical-effect, effect, action-continuation, reconcile, agent-cancellation and agent-replacement - are pinned as whole literal strings in one table, so moving their derivations to a single owner cannot change one byte of an identity that durable rows already carry."

[[sentence]]
id = "a-node-binding-is-decided-where-no-store-can-be-reached"
text = "What every kind of node binds - a V1 agent, a V2 or V3 agent under its run's role matrix, an action, a wait, a subworkflow - is decided by pure functions over a run and a document, so each of the five forms and each of its named refusals is provable with no database, no queue and no provider behind it."

[[sentence]]
id = "a-durable-binding-row-is-read-back-only-in-a-shape-this-engine-writes"
text = "A recorded node-binding row round-trips through the typed contract byte for byte, and a row that is unknown, partial, over-full, wrongly typed or disagrees with its own configuration or auth hash is refused by name rather than read as the one legacy shape."

[[sentence]]
id = "a-legacy-node-binding-row-replays-into-the-typed-decision"
text = "A run crashed after its node binding was recorded finishes after a restart that hands it the one shape written before the configuration contract existed - neither revision_format_version nor requested_capability - reaching its terminal state with one provider invocation per node and no second one."
