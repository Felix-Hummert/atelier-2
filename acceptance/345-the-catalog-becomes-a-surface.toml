schema_version = 1
story = "https://github.com/FlexOr2/atelier-2/issues/345"

# The Catalog detail is the one place where an operator reads a published
# workflow before opening its start sheet. It carries the published substance
# and its proof anchor; it does not offer an editor.

[[sentence]]
id = "a-details-panel-shows-the-published-substance"
text = "Opening the Catalog detail shows the published nodes with their roles and instruction starts, the graph miniature, and each declared order with a summary of its pinned schema — so the operator decides from the content, not only the name."

[[sentence]]
id = "a-revision-hash-is-a-proof-anchor"
text = "A revision hash in the Catalog detail is a named, copyable proof anchor that says it seals the published workflow revision."
