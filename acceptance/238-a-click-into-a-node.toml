schema_version = 1
story = "https://github.com/FlexOr2/atelier-2/issues/238"

# THE OPERATOR'S WISH, AND THE FIRST HONEST SLICE OF IT. #238 wants a click into a
# node to show what it was asked, what it answered, and the receipt that proves
# neither moved. This head does not build that panel. It removes the lie the panel
# would have been built on: a format-3 run projected its events through the V1
# mapping, so every event of a V3 run arrived naming no format and carrying no
# node rail -- a cockpit reading the stream of a run it had just started could not
# tell which family it was looking at, nor where the run stood after the event it
# had just received.
#
# WHAT WAS MEASURED BEFORE THIS HEAD WAS CUT, so it cut rather than searched:
#
#   * the ASK is derivable, hash-bound: `node_job` composes what the provider was
#     handed, and the attempt guard already recomputes it byte for byte against
#     the stored request hash.
#   * the ANSWER is durable twice over: `run_events.payload` with its
#     `payload_hash`, and the receipt's `output_bytes` with its `output_hash`.
#   * the RECEIPT carries provenance -- provider, model, executor revision,
#     operational identity, auth mode, role, and the binding and configuration
#     hashes.
#   * USAGE AND DURATION ARE NOT THERE. The item asks for them; no column holds
#     them. That is a measurement, not an omission of this file: a node-detail
#     answer can prove what ran and what came out, and cannot yet say what it
#     cost or how long it took.
#
#
# WHAT THIS HEAD ANSWERS, AND WHAT IT STILL CANNOT. The three layers the wish
# names -- ask, answer, receipt -- are all reachable, and the fourth was measured
# and is not: no receipt holds usage or duration, so this read proves what ran
# and what came out and cannot say what it cost or how long it took. That gap is
# named in the wire resource itself rather than left for a reader to discover.
#
# THE REFUSAL IS RECOMPUTED, NOT STORED. When a node cannot be handed what it
# reads, the reason lives today only as an exception inside the driver -- durably
# it exists nowhere in the product: DBOS keeps a pickled Python exception in its
# own status table, which is an implementation artefact and not a fact this
# product owns. Rather than invent a durable record under time pressure, this
# read recomputes the refusal through the same owner the driver uses, from the
# durable value and the schema its author pinned. The reason a run stands still
# is therefore derived, exactly as the job it was handed is derived.
#
# THE UI IS THE NEXT HEAD. This one hands a panel everything it needs; drawing
# the panel belongs to the cockpit family.
#
# The node-detail answer itself is THIS head: one read that hands a caller those
# layers for one node, as a route, a use case and a query.
#
# WHOSE BYTES ARE WHOSE. The provenance layer answers who *answered*, never who
# authored every byte of the value: the agent receipt is the provider's own bytes
# and nothing else, while the value a node wrote is what that execution produced
# -- which, for a node that kept a candidate, is the provider's answer with the
# atelier's own patch of the tree written into it (#1235). Both sentences below
# are worded so a reader is never told the named agent typed the whole value.

[[sentence]]
id = "a-format-three-event-answers-in-the-shape-that-says-so"
text = "Every event of a format-3 run answers in its own shape: it names the format it belongs to and carries the node rail that says where the run stands once that event is folded in, instead of borrowing the V1 shape that says neither -- and a kind a V3 run's nodes can never write is refused rather than rendered as something a reader would believe."

[[sentence]]
id = "a-click-into-a-node-answers-what-it-was-asked-and-wrote"
text = "One read of one node of a run answers what that node was handed -- the exact job the run composed for its provider, the same bytes the driver passed -- what the node wrote, with the hash its own completion event kept, and which agent under which configuration answered for it, carrying the receipt's own request hash rather than a hash of the job standing in for it, so a reader is told what the server already knows instead of stitching it together from the run, the events and the receipts."

[[sentence]]
id = "a-node-that-stops-the-run-says-what-it-is-waiting-on"
text = "A node that cannot be given what its author declared it reads names the refusal that stops it, in the words of the owner that refused -- and only then: a node whose predecessor has not written yet carries no refusal at all, and a store that disagrees with itself is reported as corruption rather than dressed as a refusal, so a run standing still says why it stands still and a run merely waiting is not called stopped."

# THE PANEL. The read above hands a caller four answers; this is where an operator
# actually clicks. Two sentences rather than one, because the second is what the
# API repair bought: the panel has to keep three situations apart that used to
# arrive as one. A node that was refused says so, loudly. A node whose work has
# not arrived says it is waiting and nothing more. A store that disagrees with
# itself never reaches the panel at all -- it answers as a problem, and the page
# shows that instead.
#
# The output is shown whole. The operator asked to see the log, and a panel that
# truncated the answer would make him open something else to read the rest.

[[sentence]]
id = "a-click-into-a-node-shows-what-it-was-asked-and-wrote"
text = "A click on a node of a run opens that node: the exact job it was handed and the exact value it wrote, both whole rather than previewed, the hash each carries, and which agent under which configuration answered for it -- and where usage and duration would stand, the panel says they are not recorded rather than leaving an operator to wonder."

[[sentence]]
id = "a-stopped-node-says-so-and-a-waiting-one-does-not"
text = "A node that stopped the run shows the refusal that stopped it, in the words of the owner that refused; a node whose work has simply not arrived shows that it is waiting and carries no refusal at all; and a store that disagrees with itself is shown as a problem rather than dressed as either."
