schema_version = 1
story = "https://github.com/FlexOr2/atelier-2/issues/63"

# Cut C of the start-by-name vertical: the seam that joins Cut A's name
# resolution to Cut B's atomic supervised start.
#
# WHAT THESE SENTENCES DO NOT SAY, and why the wording is careful:
#
#   NOTHING HERE RUNS A WORKFLOW. No V3 graph is interpreted anywhere in this
#   cut. Cut B's starter persists an already-decided terminal truth and says so
#   itself -- "without claiming an executable engine" -- and this seam does not
#   claim one either. What it guarantees is WHICH bytes a name reached and that
#   the RECORD of them is whole. V3 execution is open and belongs to #194 H1.
#
#   An earlier revision of this file said a named workflow "runs exactly the
#   bytes that name resolves to". That was the wrong word for what the code
#   does, and it is corrected here rather than argued about -- the same
#   discipline #143 and #156 applied to their own promises.
#
# Every sentence is about IN-PROCESS truth: one engine, one transaction, no
# server and no HTTP boundary. That is not convenience. A round-trip through a
# running API would prove that some server wrote something, never that this
# caller's name reached these exact bytes and that the whole record arrived
# together. The STOP measurement on #63 (comment 5308224405) is what forced the
# seam, and these sentences inherit its bound.
#
# Also deliberately absent:
#
#   - THE CLI. #111's `atelier2 run <name>` is a thin caller of this use-case in
#     the #114 pattern, and it belongs there. Building it here would have proven
#     a server round-trip, which is the one thing these sentences refuse.
#   - AUTHORED-NAME DERIVATION AND ACTOR ATTRIBUTION. Both stay open on the
#     parent cut (#187) by its reviewer's explicit note; this cut consumes the
#     name the catalog holds and attributes nothing of its own.

[[sentence]]
id = "a-name-reaches-exactly-the-bytes-it-resolved-to"
text = "A name the catalog holds reaches exactly the bytes that name resolves to, and those exact bytes are the ones the supervised start records, in this process and against this engine; a retired lineage and a name nobody admitted each record nothing and refuse in the catalog's own words."
requirement = "REQ-KATALOG-02"

[[sentence]]
id = "a-named-start-records-the-whole-durable-set-or-nothing"
text = "A supervised start reached through a name records the published revision, its workflow backing, the run, its artifact and its terminal receipt with that receipt's outputs and access entries -- all seven durable tables -- in one transaction, or records none of them, so a refused start leaves every one of those tables exactly as it found them."

[[sentence]]
id = "a-named-start-never-records-a-result-for-other-bytes"
text = "A terminal truth decided for another revision than the name resolved to is refused by name and records nothing, rather than being corrected onto the resolved revision and stored as that revision's result."
