schema_version = 1
story = "https://github.com/FlexOr2/atelier-2/issues/295"

# THE FAMILY GOT ITS WRITER. `node-execution-request/v3`, `context-package/v3`,
# `node-artifact/v3`, `node-receipt/v3` and `node_receipt_outputs_v3` landed
# with #63 as tables, triggers and typed contracts, and then stood empty: the
# writer they once had was a callerless foundation door, removed with the #216
# seam (`6f0e316`). The desk ruling on #295 (measurement of 19.08.) decided the
# family lives, because it owns the one promise the living path never held:
# everything durable used to exist only on SUCCESS, and a schema-refused answer
# was an exception that killed the driver -- run STARTED, attempt LAUNCH_ARMED,
# no trace (the live zombie class of run 8846bf47).
#
# The writer has exactly two moments. The public start persists each node's
# request and its declared context package inside the start transaction; the
# terminal write ends the execution in the same transaction as the agent
# receipt. #38's sentence 2b moved here and is now literally true: an order the
# run carries binds into the persisted package as a material member under the
# content hash of its exact stored bytes.
#
# HEAD 2 gave the second terminal ending its name. A process that dies produced
# no answer any schema owner could judge, so the words come from the supervision
# that watched it: the exit -- code, signal, or a clean exit whose answer no
# executor could read -- and a bounded tail of the standard error, in a `failed`
# receipt on the same seam. The class this closes bit live twice
# (`desk/review-pr313-b`/`-c`): the run stopped and the reason existed only in a
# log line. The standard error deliberately reaches the receipt and no further;
# the `AGENT_FAILED` event keeps carrying the bare code, so the event stream
# stays a bounded surface anybody may subscribe to.
#
# MEASURED, not guessed, while cutting that head: those runs carried a 14 KB
# diff-review order, and the suspicion was the order never survived the handover.
# It does. Neither subscription provider puts a prompt in `argv` -- Grok hands a
# prompt file, Claude standard input -- and an order of that size travels whole
# into the job the agent is handed. This stack's own bound is
# `MAXIMUM_INSTANCE_DOCUMENT_BYTES`, and it is a named door refusal before any
# row exists, never a silent death. What killed those runs is therefore the
# provider itself, and it is the receipt above that will say so in the
# provider's own words.
#
# NAMED OPEN, deliberately not written by this head:
#
#   - `cancelled` and `blocked` receipt dispositions: the cancellation path
#     writes no node receipt yet; a cancelled execution stays receipt-less like
#     a pre-writer one, and the vocabulary waits for its own head.
#   - `node-execution-request/v3` still carries `inputs=()`: the delivered
#     predecessor-output envelopes need the ready set, which has no owner yet.
#     The order members live in the package, not in the input envelopes.
#   - Wait and other non-agent nodes get requests and packages at the start but
#     no receipt at their terminal; their terminal writes have other owners.
#   - Budget aggregates (ADR 0008) and round receipts (ADR 0013) stay with
#     their own records; this head only used columns that exist.
#   - What actually kills a Grok node on a diff-review order: readable only from
#     a live run against the real provider, which is an operator gate. The
#     receipt this head writes is the instrument; reading it is its own edge.

[[sentence]]
id = "a-refused-output-ends-its-attempt-durably-named"
text = "Exact decoded output bytes that the schema their own node pinned refuses end the first attempt FAILED under OUTPUT_SCHEMA_REFUSED with a durable refusal receipt carrying the schema owner's verdict and judged bytes, and prepare the one repair attempt while the run remains STARTED; a second refused answer ends FAILED with the AGENT_FAILED event and failed node-receipt/v3 whose reason opens with the stable token output-schema-refused, bound to the request and package the start persisted, while no agent receipt, no completion event and no advanced run appear."

[[sentence]]
id = "a-succeeded-node-writes-artifact-and-receipt-atomically"
text = "A V3 agent node's admitted answer is kept durably in the record family's own vocabulary, in the same transaction as its agent receipt: the exact produced bytes as node-artifact/v3, the succeeded node-receipt/v3 naming the request and package the start persisted, and the receipt-output row binding value hash and schema revision to that artifact."

[[sentence]]
id = "a-run-input-binds-as-a-materialized-package-member"
text = "A run input binds into the node's persisted context-package/v3 as a materialized member: the stored manifest carries the content hash of the exact order bytes the run holds, and the same document started with a different order is a different package."

[[sentence]]
id = "a-dead-process-ends-its-attempt-durably-named"
text = "An agent attempt whose provider process left no usable answer ends FAILED under PROCESS_EXITED_UNSUCCESSFULLY with a failed node-receipt/v3 on the same seam a refused answer uses: its reason opens with the stable token process-exited-unsuccessfully and names how the child ended -- exit code, signal, or a clean exit whose answer no executor could read -- together with a bounded tail of its standard error, bound to the request and package the start persisted; the node detail and the run command read that reason back, an ending nobody recorded reads as recorded-by-nobody rather than as an empty one, and the AGENT_FAILED event keeps carrying the bare failure code."
