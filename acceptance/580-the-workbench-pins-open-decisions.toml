schema_version = 1
story = "https://github.com/FlexOr2/atelier-2/issues/580"

# First Workbench slice: the chat surface becomes a workshop. The rail leads to
# Workbench, the ear stays within reach, and every open decision is pinned in a
# fixed region so a request can never be lost in the growing stream (the lived
# failure mode this ruling names). A boolean or enum decision is answered
# inline on the same audited path the run page uses; a written decision links
# to the run page. Cards carrying artefacts in either direction are a named
# follow-up slice, not this one.
#
# The sentence's wording is revised, its identifier is not: the Board card it
# named as the second surface on that audited path was retired with the Board
# room itself (ADR 0019 §1, refs #698, #773), so the run page is the one other
# surface left. Nothing about the pin's own behaviour changes.

[[sentence]]
id = "the-workbench-pins-an-open-decision-until-it-is-answered"
text = "The Workbench holds every open decision in a fixed region that does not scroll with the conversation: the decision stays put while the operator keeps typing and survives leaving the surface and returning, until it is answered. Answering a boolean or enum decision inline sends the exact answer on the same audited path the run page uses, and the pin is retired only once the run has moved past that decision."
