schema_version = 1
story = "https://github.com/FlexOr2/atelier-2/issues/163"

# The shelf already publishes the template and 83 rules. This landing is the
# machine check over that shape, not a new reading of human intent. The
# sentences name what the gate now refuses. Document-level Open questions,
# journey files, Distilled-From freshness, forcing every acceptance sentence
# onto a requirement, and the operator AGREED round stay named successors.

[[sentence]]
id = "a-requirement-identifier-is-unique-and-carries-a-sentence"
text = "Every requirement block publishes a unique identifier, a sentence, a valid status, and the six template fields; a block that does not fails verification and the failure names that identifier."

[[sentence]]
id = "a-beweis-names-an-existing-sentence-or-ungebunden"
text = "A requirement's Beweis field names one or more identifiers a story declared in acceptance/, or the word UNGEBUNDEN; anything in between fails verification and the failure names the object."

[[sentence]]
id = "a-nonempty-offen-names-an-owner"
text = "A non-empty Offen field names an owner, and Offen is allowed only while the sentence is DRAFT; a violation fails verification and the failure names that identifier."
