schema_version = 1
story = "https://github.com/FlexOr2/atelier-2/issues/163"

# #460 replaces #163's transitional template with one strict grammar and an
# exact revision registry. Legacy files remain byte-frozen until migrated.

[[sentence]]
id = "a-strict-requirement-has-only-contract-sections"
text = "An approved requirement contains only a title, nonempty Intent, nonempty unique sourced rule sentences, and optional nonempty Non-goals; stale sections and unknown rule fields fail verification by name."

[[sentence]]
id = "a-requirement-revision-registry-is-linear-and-bound"
text = "The requirement registry keeps one regular numbered path per document lineage, preserves every prior revision field exactly, grows only by a valid successor, and refuses unknown fields or predecessors, self-reference, branches, multiple tips, and false file or approval digests."

[[sentence]]
id = "legacy-requirement-bytes-are-frozen-until-migration"
text = "Against an exact base, no transitional legacy requirement is added or re-pinned: its path and SHA-256 bytes stay identical until an approval-backed in-place migration."
