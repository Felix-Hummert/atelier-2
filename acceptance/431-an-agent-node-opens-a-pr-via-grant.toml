schema_version = 1
story = "https://github.com/FlexOr2/atelier-2/issues/431"

# PHASE 2: a V3 Agent node opens its own pull request through a declared open-pr
# tool grant, driving the same locked ADR-0010 EffectAdapter the Action already
# drives (issue #407 / acceptance 407). The grant is the authorization; the
# effect is the shared one. The grant binds to the connected repo the adapter
# names, not to a project_source tree-pin, so it needs no pinned source. The
# effect intent's logical key is derived from the agent node's own execution
# identity, which keeps it deterministic, collision-free, and distinct from the
# key an Action of the same operation derives from its own node -- so it reuses
# the existing effect_intents/effect_receipts tables with no schema hop. Live
# GitHub is issue #430 and not this slice.

[[sentence]]
id = "a-v3-agent-node-opens-one-pr-through-its-own-open-pr-grant"
text = "A V3 Agent node that declares an open-pr tool grant opens exactly one pull request through the shared GitHub adapter after its attempt succeeds, its own kept output is the request the pull-request body carries by request-hash marker, the effect receipt has the same result shape an Action's confirmation leaves, no exec-shaped tool_redemptions row is written, and neither a token nor a project_source pin enters the redemption."

[[sentence]]
id = "without-the-grant-the-open-pr-tool-does-not-exist"
text = "A V3 Agent node that declares no open-pr grant completes without opening any pull request and leaves no prepared effect intent or receipt, so the open-pr tool exists only where a grant declared it."
