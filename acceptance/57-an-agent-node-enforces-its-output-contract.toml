schema_version = 1
story = "https://github.com/FlexOr2/atelier-2/issues/57"

# This file carries heads 1 and 2, and names what each deliberately leaves open.
#
# Head 1 proves that a document published as a `schema` revision is a schema at
# all. It does NOT prove that an agent's decoded output satisfies it: that needs
# an execution path, and a V3 document cannot become a run until the two locks
# named in ruling 5304496219 fall with #63's non-preserving cutover
# (`adapters/yaml_workflows.py` WorkflowFormatNotExecutable, and schema.py's
# `workflow_format_version IN (1, 2)` CHECK).
#
# HEAD 2 IS THE RUNTIME HALF, and it answers the item's sentence 1b: after the
# provider decode and before the success write, the provider-neutral profile
# owner reads the exact decoded bytes against the schema the node's author
# pinned, and bytes it refuses never become a success. Its two sentences are the
# last two declared below.
#
# The item's own acceptance sentences that stay OPEN and UNPROVEN after head 2,
# named rather than silently dropped, per the pattern of
# acceptance/66-agent-as-a-markdown-file.toml:
#
#   2.  "Gueltig schreibt atomar Artefakt, succeeded-node-receipt/v3 und
#       Run-Ereignis; erst danach waechst Ready." -- PROVEN at #295 (the record
#       family's writer): the success write keeps `node-artifact/v3` and the
#       `succeeded` `node-receipt/v3` in the same transaction as the V2 receipt,
#       the run event and the run's advance. Declared as
#       `a-succeeded-node-writes-artifact-and-receipt-atomically` in
#       `295-the-record-family-gets-its-writer.toml`. The "erst danach waechst
#       Ready" half waits for the Ready owner, which does not exist.
#   3.  "Ungueltiges UTF-8/JSON, Schema-Abweichung oder Bound-Verletzung schreibt
#       atomar ein failed-node-receipt/v3 mit stabilem Reason-Token,
#       Schema-Revision und Hash der exakten decodierten Bytes; kein Artefakt und
#       kein Success-Receipt." -- head 2 proved "kein Artefakt und kein
#       Success-Receipt"; #295 proved the durable `failed` receipt with the
#       stable token `output-schema-refused` and the second
#       `AgentAttemptFailureCode` member the store's CHECK now admits (V17).
#       Declared as `a-refused-output-ends-its-attempt-durably-named` in
#       `295-the-record-family-gets-its-writer.toml`. Head 4 recorded the
#       schema revision and the hash of the exact judged bytes as fields of
#       the same `node-receipt/v3` family -- the last sentence declared below.
#       A judged receipt that omits them is refused; an older row without them
#       stays honestly empty identity.
#   4.  "Join bleibt ADR 0006: all_succeeded blockiert; all_terminal darf starten
#       und erhaelt das Failure-Receipt. Kein Sonderweg startet einen
#       Nachfolger." -- head 3 proved the half that exists. The only join a run
#       of this build applies is the omitted single-dependency `all_succeeded`,
#       and it is applied by never advancing past a node that did not succeed;
#       that is the last sentence declared below. Every AUTHORED join --
#       `all_terminal` over one dependency included -- is refused before a run
#       under its own word, proving `every-v3-shape-no-runtime-binds-is-refused-
#       by-name` (194). STILL OPEN from this sentence: `all_terminal` delivery
#       itself, and with it the `blocked` receipt ADR 0006 gives an unstarted
#       dependent and the run termination that follows from it. A refused run
#       stands still on its node instead, and its successor reads `queued`
#       rather than `blocked`. Both belong to the ready set (#86) and the node
#       state machine (#89); neither is buildable here without minting a
#       scheduler this item does not own.
#   5.  "Retry/Restart erzeugt weder zweites Artefakt noch zweites terminales
#       Receipt." -- head 3 proved it over the one retry construct that exists:
#       the replacement attempt (ordinal 2 on the same node execution, same
#       request hash). That is the second-to-last sentence declared below.
#       STILL OPEN from this sentence: an AUTHORED `retry` policy revision binds
#       nothing and is refused before a run under its own word (194); the
#       restart that re-arms a node from durable receipts alone is ADR 0001's
#       and has no V3 owner yet.
#   6.  "Derselbe Vertrag gilt fuer Claude und Codex; genau ein billbarer Canary
#       nach allen lokalen Gates." -- the provider half is the second-to-last
#       sentence declared below: a fake process per adapter (claude, codex,
#       grok) proves they take the same success-write seam and the same
#       `output-schema-refused` token. A canary is still no construct of this
#       catalog -- the operator owns it as a gate -- and
#       stays named, not built.
#
# The first sentence declared below is 1a, and 1a is EXPRESSLY NOT a substitute
# for 1b: 1a proves the bound contract is a contract, 1b proves the core holds an
# output to it. What remains open above is owned elsewhere: blocked receipts
# and run termination (#86/#89), restart-from-receipts (no V3 owner), cancelled
# receipts (#295), and the canary as an operator gate. This item's own
# sentences are the ones declared below.
#
# SHARPENED, not narrowed, by head 1b. The closed profile the first sentence
# names grew three rules after Codex found that head 1 checked a reference's
# LOCALITY but never its RESOLVABILITY: `{"$ref": "#missing"}`,
# `{"$ref": "#/$defs/missing"}` and `{"$ref": "#"}` were all accepted, and the
# configured evaluator then raised NoSuchAnchor, PointerToNowhere and
# RecursionError. The sentence's wording did not change and did not need to --
# those bytes were always outside the profile in spirit -- but its proof now
# covers resolvability, reference-cycle termination, and a pinned dialect.
#
# One standing guard carries no sentence of its own, in the manner of
# 89-…toml's "the V1 wire is unchanged": nothing this profile accepts may break
# the evaluator. `test_no_accepted_schema_can_break_the_evaluator` holds it over
# the three cases that could, because a published revision that passes the
# profile and then blows the stack is not a refusal, it is an outage.

[[sentence]]
id = "a-schema-revision-outside-the-profile-is-refused-by-name"
text = "A document whose outputs[*].schema pins a published revision that is not a Draft 2020-12 schema inside the closed profile is refused by name at the reference site, before anything can be bound or started."

[[sentence]]
id = "no-schema-reference-ever-leaves-the-document"
text = "A nonlocal $ref, an $id, an $anchor, an $dynamicAnchor and an $dynamicRef are each refused by name, and reading any schema document attempts exactly zero retrievals."

[[sentence]]
id = "an-unusable-schema-is-drawn-as-unresolved-and-refuses-the-binding"
text = "One finding reaches both callers correctly: the composed preview names it as an unresolved reference and keeps drawing, while the run-configuration binding refuses the whole snapshot."

# Head 2. The runtime half: what an agent answers is held to what its node
# declared, and the shape that declaration must have is refused before anything
# runs when no owner enforces it.

[[sentence]]
id = "an-agent-node-whose-output-shape-has-no-owner-refuses-before-a-run"
text = "An agent node that declares no output, or more than one, is refused under the name agent-output-shape-unavailable before any run is written and before any provider process starts, because single-json-output/v1 -- exactly one declared output whose whole decoded bytes are its value -- is the one output shape a run enforces."

[[sentence]]
id = "bytes-their-own-schema-refuses-never-become-a-success"
text = "Exact decoded output bytes that the schema their own node pinned does not admit never produce a success: the refusal is named in the words of the schema profile owner, and no agent receipt, no completion event and no advanced run are written, while bytes that schema admits are still written as the one atomic success."

# Head 3. The two constructs the item's sentences 4 and 5 name that this build
# really has: the omitted single-dependency join, and the replacement attempt.
# What each deliberately leaves open is written out in the header above.

[[sentence]]
id = "a-retry-is-held-to-the-same-contract-and-leaves-one-of-each"
text = "A replacement attempt of a node execution answers to the same declared schema its first attempt would have met, and the node execution keeps one terminal receipt and -- only where the schema admitted the bytes -- one artifact, however many attempts stood in the store; once an output was refused, no replacement can be minted at all, so the refusal's failed receipt is the node execution's one and only ending."

[[sentence]]
id = "a-refused-output-never-releases-the-node-behind-it"
text = "A node whose declared output its own schema refuses never releases the node that depends on it: the run does not move off the refused node, no attempt is ever opened for the successor and no artifact exists, while one character of difference in the same answer releases that same edge -- which is the omitted single-dependency all_succeeded of ADR 0006, applied by there being no path past a node that did not succeed."

# Head 4. The two remaining #57 sentences this item still owns: the receipt
# carries the schema identity it judged, and every executor adapter meets that
# same seam. What this item does not own stays named in the header above.

[[sentence]]
id = "a-judged-receipt-names-the-schema-identity-it-judged"
text = "A node-receipt/v3 written for a schema judgment carries the schema revision and the hash of the exact decoded bytes it judged as its own fields of that same family; a receipt of that judgment that omits them is refused, and an older row that never had them remains readable as honestly empty identity."

[[sentence]]
id = "every-executor-meets-the-same-output-contract-seam"
text = "Claude, Codex and Grok each take a decoded provider answer through the same success-write seam, and bytes their node's schema refuses end under the same token output-schema-refused; the proof is a fake process per adapter, not a billed call."
