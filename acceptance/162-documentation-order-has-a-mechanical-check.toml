schema_version = 1
story = "https://github.com/FlexOr2/atelier-2/issues/162"

# #162 still owns the tree-only provenance check. Revision approval and strict
# document shape are owned by #460; the later curating workflow stays on #162.

[[sentence]]
id = "a-requirement-rule-names-its-source-and-degree"
text = "Every active requirement rule names OPERATOR or DESK and a source pointer; a strict rule that does not fails verification and the failure names that identifier."

[[sentence]]
id = "the-documentation-order-gate-states-the-bound-of-what-it-proves"
text = "The documentation-order gate states the same bound the documentation states: it proves versioned shape and byte binding without claiming that a cited live source or approval says what review recorded."

[[sentence]]
id = "a-new-source-object-after-a-bound-watermark-names-the-document-as-stale"
text = "For each source-bound active requirement revision, a newly observed thread or decision object after its bound watermark causes the pure freshness read to name that document exactly once as stale; no later object yields a current reading, and an unresolved watermark yields no freshness report."

[[sentence]]
id = "a-curator-candidate-is-bound-to-exact-stale-view-and-owner-artifacts"
text = "A headless curator receives typed stale-report, current-document, owner-source, and context artifacts and may return only a closed schema-valid candidate carrying stale document paths, expected current digests, UTF-8 replacement content, cited owner objects, and unresolved questions; it does not claim prose faithfulness."

[[sentence]]
id = "an-independent-trace-review-is-bound-to-the-curator-candidate-and-owner-evidence"
text = "A trace reviewer from a provider family different from the curator receives the curator candidate, original owner-source evidence, and required context and may return only a closed structured verdict bound to that candidate digest, with per-document traced or untraced judgements citing owner objects; it does not write the repository."

[[sentence]]
id = "an-explicitly-released-approved-documentation-candidate-opens-one-draft-pr"
text = "An explicitly released, independently approved documentation candidate opens exactly one draft pull request containing exactly its reviewed document changes; retries never create a second commit or pull request."
