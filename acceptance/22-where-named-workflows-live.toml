schema_version = 1
story = "https://github.com/FlexOr2/atelier-2/issues/22"

# One sentence of #22 is deliberately absent, because nothing has closed it and
# declaring it would red this gate for work nobody has built:
#
#   "the library shows names, never hashes" — requirement 0003 REQ-UI-05 in full.
#   A V1 or V2 revision carries no authored name and never will, so while the
#   picker lists revisions rather than lineages, a hash stays the only honest
#   label for one. The rule becomes provable when `catalog_lineages` and
#   `catalog_lineage_aliases` exist, which ADR 0007's Store dimensions places in
#   #63's cutover after #16 phase 2. Writing it green before then would narrow
#   the wish; declaring it now would red this gate for a store nobody has cut
#   over. It joins this file in the change that proves it.
#
#   "the picker offers a name to choose, and shows the exact hash only under
#   details" — declared by the cockpit head and withdrawn again here, because it
#   is not true of this tree. The listing projection decides both halves from one
#   predicate (`api/projection/workflows.py`): `described = isinstance(graph,
#   WorkflowGraphV3)`, then `executable=not described` and `name=graph.name if
#   described else None`. Named and startable are therefore exact negations of
#   the same test — every named row is V3 and disabled in the picker, every
#   choosable row is V1/V2 and labelled by its hash. No operator can choose a
#   named workflow, so the sentence cannot be honoured by any tree that has no
#   named executable lineage. It joins this file when #63 cuts over
#   `catalog_lineages` and one exists; rewording it to what today's picker can do
#   would narrow a separately approved wish, which is the one repair the review
#   forbids.
#
# The second picker sentence below stays declared, because it is true as written:
# a revision no run can start says so before the operator tries. Its proof is
# untouched.
#
# A third sentence was retired on 31.08.2026 (#901 slice 5, #934), dated per
# the same discipline as the two above:
#
#   "a-format-that-declares-no-name-is-listed-as-unnamed" -- it promised a
#   listing for the format family that could publish with no name at all. The
#   V1/V2 document grammar fell with this slice, so no format left in
#   `WORKFLOW_DOCUMENT_FORMATS` admits a document without one: a format-3
#   document always declares `name` (`contracts/workflows_v3.py`,
#   `WorkflowGraphV3.name: NonemptyString`), so the unnamed state the sentence
#   named is unrepresentable, not merely unproven. Its former proof,
#   `tests/integration/test_catalog_descriptions.py`, is retired with it.
#
# This file therefore does not list every sentence of #22.

[[sentence]]
id = "a-published-revision-is-listed-with-the-name-its-author-wrote"
text = "A published workflow revision is listed with the name its author wrote into the document, not with its hash."
requirement = "REQ-KATALOG-04"

[[sentence]]
id = "the-description-is-read-from-the-published-bytes-and-from-nowhere-else"
text = "A revision's description is read from the exact bytes that were published and from nowhere else, so no second place can disagree with it."
requirement = "REQ-KATALOG-04"

[[sentence]]
id = "an-enriched-page-stops-at-its-derived-bound-and-pages-on"
text = "A listing stops at the bound derived from what one document may cost, still answers with at least one revision, and says where the next page starts."

[[sentence]]
id = "a-revision-no-run-can-start-says-so-before-the-operator-tries"
text = "A revision no run can start says so in the picker, with the reason, before the operator tries to choose it."

[[sentence]]
id = "a-revision-no-run-can-start-says-so-where-it-was-published"
text = "A published revision no run can start says so where the operator published it, with its name and the reason, instead of failing as a wire-contract error or offering a Start it cannot honour."

[[sentence]]
id = "the-picker-offers-every-saved-workflow-not-only-its-first-page"
text = "The picker offers every saved workflow the store holds, following the listing to its end, so a workflow on a later page is offered rather than absent."
