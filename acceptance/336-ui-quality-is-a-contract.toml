schema_version = 1
story = "https://github.com/FlexOr2/atelier-2/issues/336"

# Kopf 1 of #336: the quality contract becomes requirement sentences, and the
# first two machine checkers run in CI. The other seven criteria stay
# UNGEBUNDEN — they name a review ritual, a click budget, a later measurement,
# or the operator's last word, none of which this landing claims to have.

[[sentence]]
id = "core-surfaces-render-owned-display-strings-under-a-pseudo-locale"
requirement = "REQ-UIQ-12"
text = "Studio, New Run, and the Run page render the display strings their existing vocabulary owner holds even when those strings are wrapped in a pseudo-locale, so a second hardcoded copy of an owned string cannot hide on those surfaces."

[[sentence]]
id = "core-surfaces-have-no-unnamed-axe-violations"
requirement = "REQ-UIQ-05"
text = "axe-core, run to WCAG 2.2 AA over Studio, New Run, and the Run page, reports no violation that is not named in the checked-in baseline with an owning work item."
