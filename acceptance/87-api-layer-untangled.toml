schema_version = 1
story = "https://github.com/FlexOr2/atelier-2/issues/87"

# Issue #87 is built as six serial heads, and each sentence joins this file in the
# change that proves it. Declaring one earlier would red this gate on main for a
# capability nobody has built. This file therefore does not list every sentence
# of #87.
#
# THE WRITE SET IS FINISHED, and the sentence it was waiting for is declared
# below. The last call was the cancellation, held back only because its module was
# being rewritten by #70; #70 landed, and the pass-through that handed its port
# union straight to a route is translated like every neighbour.
#
# Two machine fences deleted themselves with it, which is what they said they
# would do. ROUTE_CALLS_STILL_HOLDING_PORTS named every port a route still
# reached, and went red in both directions -- an undeclared reach, and a declared
# reach that no longer happened. Emptying it was therefore not a decision anyone
# could take quietly: the last translation turned the guard red on its own stale
# entry, and the map deleted itself as its docstring promised. The `ignore_imports`
# entry for `agent_attempts` went the same way, because a stale ignore is an error
# there too. What is left is the plain rule, and the sentence below says it.
#   - the fail-open defaults are gone. `agent_executor_registry` in
#     `adapters/dbos/starter.py` and the publication bound in
#     `application/publish_workflow_revision.py` are both required now, and the
#     sentence below is what pins it. The projection bound is not among them: it
#     is no parameter at all, because the reader holds it.
#     What the sentence deliberately does NOT claim is that no optional
#     dependency exists anywhere — `tests/scenarios/` keeps named defaults on
#     purpose, so a scenario says what it binds instead of a production owner
#     inventing one.

[[sentence]]
id = "wire-schemas-name-no-port-type"
text = "The schemas the API accepts and answers with name no durable port type: the wire and the projection that fills it are separate modules, and a schema module that reaches for a port fails verification instead of being noticed in review."

[[sentence]]
id = "every-read-decision-belongs-to-a-use-case"
text = "Every read the API offers is decided by a use-case that translates the store's answer into the application's own outcome, so each way a read can fail is a named member of that outcome rather than a port type a route matches on."

[[sentence]]
id = "a-durable-reader-holds-the-bound-it-reads-under"
text = "A durable reader holds the bound it reads under: no caller passes one, a reader cannot be built without one, and the bound it was built with is the one it applies — so there is no unbounded read to reach by leaving an argument out."

[[sentence]]
id = "no-write-path-can-be-reached-with-a-dependency-left-out"
text = "No durable write can be reached with the dependency it enforces left out: the publication use-case takes its bound and the run starter takes its executor registry as required arguments, the value handed over is the value applied, and omitting one is a type error rather than a permissive write."

[[sentence]]
id = "a-port-refuses-by-type-and-the-api-words-the-answer"
text = "A durable port refuses a projection that exceeds its reader's bound by naming what happened, not by wording the answer: it carries no sentence about the caller's limits, the layer that set the bound says what it means, and the caller receives exactly the status and words it received before."

[[sentence]]
id = "one-page-of-a-stream-is-decided-before-any-frame-is-written"
text = "What one page of a run's event stream means is decided by a use-case before any frame is written: a page, a store that could not answer, an answer no sequence of writes could have produced, or more events than the page that was asked for — and the stream itself owns only what the API owns, its query budget, its limits, its rendering and how long it waits."

[[sentence]]
id = "the-use-case-record-cannot-hand-a-route-a-port"
text = "The record of use-cases a route holds cannot carry a port back to it: a field annotated with anything that resolves to a durable port, including behind a bound call, a forward reference or a type-checking-only import, fails verification."

[[sentence]]
id = "no-route-reaches-a-port-and-the-verification-says-so"
text = "No route reaches a durable port: a route that reads one -- directly, through an alias, or inside a module that still holds the composition -- fails verification rather than being noticed in review, and there is no declared exception left for one to hide behind."

[[sentence]]
id = "every-write-decision-belongs-to-a-use-case"
text = "Every write the API offers is decided by a use-case that translates the store's answer into the application's own outcome, so each way a write can fail is a named member of that outcome rather than a port type a route matches on -- the cancellation included, which was the last route to hand its port union straight through."
