story = "https://github.com/FlexOr2/atelier-2/issues/900"

# The Runner's journal bound and the session's transport bound answer one
# question between them. This sentence is about the whole Runner-to-Core path,
# not about the two numbers agreeing; the numbers are pinned in
# tests/domain/test_runner_session_codec.py. Two tests carry it: one drives the
# record a real Runner originates from a live provider child, the other the
# widest record the journal may hold, which is what the transport is sized for.

[[sentence]]
id = "what-may-be-stored-can-be-delivered"
text = "A record the journal may store reaches Core over a real Runner session, up to the largest one a session's own identities allow; a record the session cannot frame fails instead."
