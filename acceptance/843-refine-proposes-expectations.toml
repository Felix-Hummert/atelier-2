text = "A one-round headless catalog refine workflow receives an operator vision and its owner documents, then returns a two-sentence mirror and proposed expectation lines or an explicit absence for every create/change/remove, identity, states, secrets and rights, undo, and scale lens before a picture or breakdown carries the work onward."
