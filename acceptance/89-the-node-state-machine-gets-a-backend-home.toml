schema_version = 1
story = "https://github.com/FlexOr2/atelier-2/issues/89"

# One sentence of #89 is deliberately absent: "the V1 wire is unchanged" is a
# standing guard of every head rather than an outcome of one, and
# tests/api/test_v1_wire_freeze.py already holds it without this gate.
#
# The last sentence below is the one head C's ruling narrowed in writing
# (https://github.com/FlexOr2/atelier-2/issues/89#issuecomment-5304715493),
# quoted as it was ruled. Its named exception is a debt with an owner, not a
# quiet retreat: `v1SnapshotNodeState` in frontend/src/lib/runProjection.ts is
# the only place a browser still derives a durable state, it exists because the
# V1 run resource and the V1 event schema are byte-frozen, and it dies with the
# V3 cutover in #63. Nobody may read the sentence as covering a V1 run.
#
# This file therefore does not list every sentence of #89.

[[sentence]]
id = "the-node-state-derivation-is-provable-without-a-browser"
text = "The state of every node of a run is derived by a pure function in src/, provable over a snapshot and its events without a browser, without an HTTP client and without a real database."

[[sentence]]
id = "a-node-ending-in-success-has-exactly-one-name"
text = "A node that ended in success has exactly one name everywhere it is named; the second spelling is deleted rather than kept as an alias."

[[sentence]]
id = "the-run-resource-names-the-state-of-every-node"
text = "A served V2 run names the state of every node of the revision it is bound to, so the browser renders that state instead of inventing it."

[[sentence]]
id = "the-browser-and-the-served-contract-know-the-same-node-states"
text = "The browser and the served contract know exactly the same set of node states: a member added on one side alone fails a test."

[[sentence]]
id = "the-browser-derives-no-durable-state-for-a-v2-run"
text = "Der Browser leitet für V2-Runs keinen durablen Zustand mehr ab; die eine benannte Ausnahme ist `v1SnapshotNodeState` für die eingefrorene V1-Ressource, und sie stirbt mit dem V3-Cutover (#63)."

[[sentence]]
id = "the-interaction-overlay-lifts-and-stills-under-separate-gates"
text = "The only state rule left in the browser is the interaction overlay, it is client-owned, and its two rules are gated separately: a node is lifted to working only when it needs the operator and his form is open, while it is stilled by the open form alone."
