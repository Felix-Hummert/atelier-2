schema_version = 1
story = "https://github.com/FlexOr2/atelier-2/issues/89"

# One sentence of #89 is deliberately absent: "the V1 wire is unchanged" was a
# standing guard of every head rather than an outcome of one, and it ended when
# the V1/V2 wire itself fell (#904, PR #920; its freeze test went with it).
#
# Two sentences were retired on 31.08.2026 (#901 slice 4, #924), in the same
# landing that deleted the surface they measured -- the discipline
# acceptance/131 already used:
#
#   "the-browser-derives-no-durable-state-for-a-v2-run" -- head C's ruled
#   sentence (https://github.com/FlexOr2/atelier-2/issues/89#issuecomment-5304715493)
#   with its one named exception, `v1SnapshotNodeState` for the byte-frozen V1
#   resource, promised to die with the V3 cutover. That promise is now kept:
#   the function, the whole browser-side rail derivation, and the V1/V2 run
#   and event decoders are deleted, so no browser derives any durable state
#   for any run and there is no V2 run left to prove the sentence against.
#
#   "the-interaction-overlay-lifts-and-stills-under-separate-gates" -- the
#   client-owned overlay was the last state rule in the browser, and it lived
#   only on the deleted V1/V2 cockpit; the V3 view renders the rail the server
#   walked.
#
# A third sentence was retired on 31.08.2026 (#901 slice 5, #934), dated per
# the same discipline as the two above:
#
#   "the-run-resource-names-the-state-of-every-node" -- it promised this for a
#   *served V2* run. The V1/V2 document grammar fell with this slice, so no
#   V2 run is ever served again; the sentence's own subject is gone. The
#   behavior it measured survives, ordinary (unclaimed) test coverage of the
#   V3 run resource in `tests/api/test_agent_attempts.py`.
#
# This file therefore does not list every sentence of #89.

[[sentence]]
id = "the-node-state-derivation-is-provable-without-a-browser"
text = "The state of every node of a run is derived by a pure function in src/, provable over a snapshot and its events without a browser, without an HTTP client and without a real database."

[[sentence]]
id = "a-node-ending-in-success-has-exactly-one-name"
text = "A node that ended in success has exactly one name everywhere it is named; the second spelling is deleted rather than kept as an alias."

[[sentence]]
id = "the-browser-and-the-served-contract-know-the-same-node-states"
text = "The browser and the served contract know exactly the same set of node states: a member added on one side alone fails a test."

