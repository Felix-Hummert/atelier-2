schema_version = 1
story = "https://github.com/FlexOr2/atelier-2/issues/38"

# THE ORDER BECAME MATERIAL. Until this head the job travelled inside the
# document, so one distinct input burned one published revision -- the everyday
# reflex this story exists to end. A run started through `start_published` now
# carries the order beside the document: stored under the run, immutably, and
# handed to the agent that declared it reads it.
#
# What that took, because it is the reason this took three attempts: the
# executable admission had to stop refusing `inputs`, the `graph_inputs` schema
# reference had to actually resolve at the public start rather than be refused
# with every other declared reference, and the driver had to hand the order on.
# A head that did only the first two would have admitted a document whose inputs
# the run then ignored in silence; one that did only the storing would have built
# a run that remembers an order nobody reads. The measurement that ruled them
# inseparable is 5313021607.
#
# STILL OPEN, and named rather than quietly dropped:
#
#   2b. The supplied value is hash-bound in the run snapshot as a context-package
#      member, and visible with its provenance. The value IS hash-bound under the
#      run and the agent receives it; what is absent is the node-record half --
#      no runtime authors a `context-package/v3` or a `node-execution-request/v3`
#      yet, so there is no package for it to be a member of. That is the record
#      family's own head, not a wording this one may narrow. 2b moved to #295
#      (18.08.): whether the record family gets its first honest writer or
#      falls as deadweight is that item's decision, and this declaration
#      travels with it rather than being narrowed here.
#   4. The conductor loop needs no revision per turn. The CLI half of the order
#      is `--input` / `--input-file`; the loop itself still belongs to #7.
#
# #38's retire condition on 2b moved with it: that open half now lives, and is
# tracked, at #295 -- not here.
#
# ALSO ABSENT ON PURPOSE, each because the start would otherwise ignore what an
# author wrote: an `inputs` entry whose source is another node's output, a node
# receipt or a context entry is refused by the source it named, and so is an
# authored `value` -- a constant inside the document is the very thing an order
# replaces. Those sources need the ready set and the record family; they are
# refused today rather than admitted and dropped.

[[sentence]]
id = "an-unreadable-or-unread-graph-input-is-refused-by-name"
text = "A document whose node reads a graph input the graph never declared, and a document whose declared graph input no node reads, are both refused by name before anything can be published or started."

[[sentence]]
id = "a-parent-graph-input-reaches-a-child-through-the-boundary"
text = "An order the parent graph declares reaches a subworkflow: it binds as a node input to the child's graph input, and a differing schema revision is refused by name."

[[sentence]]
id = "the-preview-names-every-declared-graph-input-with-its-schema"
text = "Before any start, the preview names every declared graph input with its name and schema revision, at the graph that declared it."

[[sentence]]
id = "a-run-carries-its-order-as-material-not-as-a-new-revision"
text = "An operator starts one published workflow revision with the order it should run on, and the run carries that order as material: the exact bytes are stored under the run and the name its author declared, immutably, and the agent whose node reads that order is handed it -- so the same published revision serves every order instead of one revision per distinct input."

[[sentence]]
id = "an-order-the-start-cannot-honour-is-refused-by-its-own-name"
text = "A start whose order is missing, is one the document never declared, does not satisfy the schema the document pinned, or is supplied twice under one name, is refused naming that input -- and leaves no run, no configuration, no order and no enqueue behind."
