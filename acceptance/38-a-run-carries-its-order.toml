schema_version = 1
story = "https://github.com/FlexOr2/atelier-2/issues/38"

# This file does not list every sentence of #38, and that is deliberate.
#
# #38 wants a run to carry its order as input. The head that lands here — plan
# 5304493237, amendment 5304533072, deputy PASS 5304543725 — makes that order
# declarable, completely checked and visible. It does not make commissioning
# real: no V3 document can become a run yet (`parse_executable_workflow_document`
# refuses format 3, and `runs.workflow_format_version IN (1, 2)` refuses the row),
# and that gate belongs to #63.
#
# Four sentences of #38 therefore have no proof of any kind and are named here
# rather than quietly dropped:
#
#   1. A published workflow is reusable with different run inputs, without a new
#      revision.  -- DECLARED BELOW, for the supervised start.
#   2b. The supplied value is hash-bound in the run snapshot as a context-package
#      member, and visible with its provenance.  -- DECLARED BELOW.
#   3b. A run start with a missing, schema-violating or oversized input is refused
#      by name, leaving no run, context, attempt, event, enqueue or process behind.
#      -- DECLARED BELOW for the supervised start. The executable start still
#      refuses a document that declares `inputs`, so there is no attempt, event,
#      enqueue or process for an order to leave behind yet; that door is the next
#      head, and this sentence widens with it rather than being counted as done.
#   4. The conductor loop needs no revision per turn.  -- still open: it needs the
#      command, which is the head after that one.
#
# Sentence 2 was split into 2a (declared below) and 2b; sentence 3 into 3a
# (declared below) and 3b. 3a is a document-level refusal and is EXPLICITLY NOT a
# substitute for 3b, which is a start-level refusal: no review may count 3a for
# it. #38 is not verified and not retired while any of the four above is open.
#
# Declaring them now would red this gate on main for a capability nobody has
# built, and inventing a proof to make it green is the one thing ADR 0012 forbids.
# They join this file in the change that proves them.

[[sentence]]
id = "an-unreadable-or-unread-graph-input-is-refused-by-name"
text = "A document whose node reads a graph input the graph never declared, and a document whose declared graph input no node reads, are both refused by name before anything can be published or started."

[[sentence]]
id = "a-parent-graph-input-reaches-a-child-through-the-boundary"
text = "An order the parent graph declares reaches a subworkflow: it binds as a node input to the child's graph input, and a differing schema revision is refused by name."

[[sentence]]
id = "the-preview-names-every-declared-graph-input-with-its-schema"
text = "Before any start, the preview names every declared graph input with its name and schema revision, at the graph that declared it."

# THE ORDER BECOMES MATERIAL. Until this head the job travelled inside the
# document, so one distinct input burned one published revision -- the reflex
# this story exists to end. The supervised start now carries the order beside the
# document: stored under the run, named in the node's declared context package,
# and bound into its request as a succeeded input envelope.
#
# Deliberately absent, and named rather than implied:
#
#   - THE EXECUTABLE DOOR. `inputs` is still a form the executable admission
#     refuses, so a run an engine executes cannot yet take an order. That widening
#     and the `--input` flag are the next head.
#   - NON-TEXT ORDERS. One order is exact bytes against a published schema. What
#     an attachment or a file reference would mean is its own wish.
#   - THE SELECTOR MATERIALIZER. `required_context` slices a source; an order
#     carries its own bytes and needs no selector at all.
#
# ONE REFUSAL IS DECLARED WITHOUT A TEST, AND THAT IS SAID RATHER THAN HIDDEN.
# `schema-unreadable` answers the case where the schema revision an order names
# is absent from the store, or is present and is not a schema this profile can
# enforce. Reaching it needs a store whose published bytes contradict the
# document that pinned them -- durable corruption, not an input a caller can
# send -- so a test would have to write that corruption itself and would then be
# proving its own fixture. The branch is one refusal beside four proven ones and
# is named here so the gap is visible instead of comfortable. It is the same
# discipline `acceptance/111-…` applies to `catalog-revision-not-a-member`.

[[sentence]]
id = "a-run-carries-its-order-as-material-not-as-a-new-revision"
text = "A supervised start carries the order it was given as material: the exact bytes are stored under the run and the name its author declared, immutably, and the node's own records name them -- the declared context package by the hash of those bytes, the request as a succeeded input envelope -- so the same published revision serves every order instead of one revision per distinct input."

[[sentence]]
id = "an-order-the-start-cannot-honour-is-refused-by-its-own-name"
text = "An order the start cannot honour is refused by the name of the input it is about -- a declared order nobody supplied, an order the document never declared, one whose schema is not the schema the document pinned, and a value that schema refuses or that is too large to be read -- and nothing is written."
