schema_version = 1
story = "https://github.com/FlexOr2/atelier-2/issues/94"

# One further sentence is declared on issue #94 — "a story that declares no
# acceptance sentence is named by verification" — and is deliberately absent
# here: it is unbuilt, and declaring it would red this gate on main for a
# capability nobody has built. It joins this file in the change that proves it.
# This file therefore does not list every sentence of #94.

[[sentence]]
id = "acceptance-sentences-are-declared-in-the-repository"
text = "Every acceptance sentence a story defines is readable from a versioned file in this repository, with its identifier and its wording, instead of living only in pull-request prose."

[[sentence]]
id = "an-unproven-sentence-fails-the-gate"
text = "A declared acceptance sentence that no test claims to prove fails verification, and the failure names that sentence."

[[sentence]]
id = "an-orphaned-proof-fails-the-gate"
text = "A test claiming to prove a sentence that no story declares fails verification, and the failure names that claim."

[[sentence]]
id = "a-proof-that-did-not-run-and-pass-fails-the-gate"
text = "A proof that did not run and pass in this pipeline's own run reports counts as no proof, and the failure names it."

[[sentence]]
id = "a-second-story-declaration-verifies-like-the-first"
text = "A repository in which a second story declares its own acceptance sentences verifies exactly like one in which a single story does: the extra declaration is read as one more story, never as a failure."

[[sentence]]
id = "the-gate-states-the-bound-of-what-it-proves"
text = "The gate states the same bound of its own judgment that the documentation states: it proves linkage and existence, never that a test carries its sentence in meaning."
