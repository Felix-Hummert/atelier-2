schema_version = 1
story = "https://github.com/FlexOr2/atelier-2/issues/294"

# RECOMMENDED OCCUPANCY PER WORKFLOW LINEAGE IS PROJECT CONFIGURATION.
#
# The last browser choice still lives in localStorage. This sentence binds the
# first backend owner: PUT then GET
# /projects/{public_project_reference}/occupancy/{lineage_id} store and return a
# typed occupancy revision for a configured project and an existing workflow
# lineage, including a project id that is not a single URL path segment. A
# configured project with no occupancy is occupancy-missing. An unknown project
# is project-unknown. GET and PUT of an unknown lineage are
# catalog-lineage-missing, and PUT leaves occupancy unchanged. The picker does
# not read this recommendation yet.

[[sentence]]
id = "recommended-occupancy-is-project-configuration-on-the-wire"
text = "PUT /projects/{public_project_reference}/occupancy/{lineage_id} stores an occupancy revision for a configured project and an existing workflow lineage, and GET returns that latest revision; a project with no occupancy is occupancy-missing, an unknown project is project-unknown, and GET or PUT for an unknown lineage is catalog-lineage-missing while PUT leaves occupancy unchanged."
