# PHASE D1: ONE MANUALLY APPROVED ITEM STARTS ONCE.

[[sentence]]
id = "a-manually-approved-queue-item-starts-once"
text = "An observed item receives one typed proposal containing its priority, workflow and prerequisites; the operator confirms the inspected proposal, and the queue binds it once to one exact run and workflow revision without a second launch after restart or lineage-head movement."

[[sentence]]
id = "the-v43-hop-invents-no-queue-decision"
text = "Migrating the live V43 queue rows into the V44 Phase-D state preserves every recorded identity and admission but invents no priority, authorization, dependency or launch; an old admission whose launch cannot be proved waits visibly for review instead of being started again."

# PHASE D2 (SLICE A2): A QUEUE-STARTED RUN CARRIES THE ITEM IT IS ABOUT.

[[sentence]]
id = "a-refused-queue-start-stays-at-its-item-while-the-sweep-continues"
text = "When a queued item's start is refused, the refusal stays scoped to that one item -- it alone stays unstarted -- and the other admitted items still start in the same sweep."
