schema_version = 1
story = "https://github.com/FlexOr2/atelier-2/issues/194"

# CURRENT V13 TRUTH. The admitted V3 shape is a linear sequence of Agent and
# Wait nodes, not the private one-node foundation this file first described. The
# in-process public starter writes a format-3 run and its frozen bindings,
# enqueues the bootstrap, and the runtime invokes the existing provider/Attempt
# owner for each Agent node. A successful node writes one `AgentReceiptV2` and
# one `AGENT_COMPLETED` event; a Wait node writes `WAITING_INPUT` and stops until
# a person answers; the authored heir starts, and the sink completes the run on
# its terminal hash. #219 separately proves the HTTP resource -- this file proves
# the public in-process start seam and never substitutes that for an HTTP call.
#
# The form remains deliberately narrow: one entry, one sink, Agent and Wait nodes
# only, at most one predecessor and one dependent, and none of the optional V3
# fields the runtime does not bind. Branching, fan-out/join and every unbound
# form are still refused by name before a run exists.

[[sentence]]
id = "a-v3-agent-document-starts-and-binds-its-node"
text = "A V3 document of an admitted shape -- a line of agent nodes, each entered by at most one dependency and followed by at most one dependent, declaring nothing no runtime binds -- starts as a run of its own format, reads back as a V3 run rather than a V2 one wearing a new number, and binds each node onto the durable attempt path -- with exactly the role, model, executor revision and capability it was started with -- as the run reaches it."

[[sentence]]
id = "every-v3-shape-no-runtime-binds-is-refused-by-name"
text = "Every V3 document outside that shape is refused by name before anything starts, and the refusal says what it is waiting for -- a node kind nothing interprets, a branch nothing chooses between, or an authored form nothing binds -- rather than saying that version 3 is unsupported."

# RETIRED WITH THE STOPGAP IT DESCRIBED, AND NAMED HERE RATHER THAN DELETED.
# This file declared `a-public-start-refuses-a-v3-revision-before-any-write`
# twice over, for two different reasons. The first reason -- nothing executes a
# V3 document -- expired when the driver landed. The second -- the API had no
# resource to answer with a V3 run -- outlived it, and the sentence was
# re-declared on that reason alone as a named bridge, because a start this API
# could not answer had to leave nothing behind.
#
# #219 built the answer, so the bridge is gone and the sentence with it: a V3
# revision started over HTTP now receives its run. What replaces it is
# `a-v3-run-answers-over-http-with-its-own-resource` in #219's own file, which is
# the stronger claim on the same ground. Nothing about a half-started run went
# unproven in between, and nothing is silently dropped here.

# One thing between the two layers was a real defect rather than a missing
# decision: the run projection's column list omitted the configuration revision a
# `RunV3` is bound to, so every read of a V3 run raised `NoSuchColumnError` from
# inside the adapter -- the API crashed under its own refusal instead of reaching
# it. Fixed here and pinned by a query-layer test, because the driver makes a V3
# run something a read can now actually meet.

[[sentence]]
id = "a-v3-run-drives-itself-through-the-runtime"
text = "A V3 revision starts through the one public start like any other executable document -- its run row, its agent bindings and its enqueued bootstrap -- and the runtime then drives the line its author declared without any hand reaching in: each agent node's attempt runs and succeeds, the heir the author declared starts when its predecessor completes, and the sink carries the run to COMPLETED on a terminal hash that recomputes from the events the run itself wrote."

[[sentence]]
id = "a-v3-agent-node-reaches-the-durable-attempt-path"
text = "A V3 agent node is admitted by the durable attempt store under the same role binding, attempt identity and provider contract a V2 node uses, while a run that does not exist is still refused by name."

[[sentence]]
id = "a-v3-run-follows-the-edge-its-author-declared"
text = "After a successful attempt on a V3 node that is not its run's sink, the durable head the next attempt reads stands on the one heir its author declared, and the last node of the line carries the run to COMPLETED with its terminal hash, so a line is executed in the order it was written rather than one node at a time by whoever asks."

[[sentence]]
id = "a-completed-v3-attempt-reaches-the-runs-terminal-hash"
text = "A V3 agent attempt that succeeds records the provider's receipt and carries its own run to COMPLETED with a terminal hash, exactly as a V2 attempt does; a V3 node that is not its run's sink hands on to the one heir its author declared, and a node with several dependents is refused in typed words instead of advanced, because choosing between them is the ready set's decision and not this one's."

[[sentence]]
id = "a-v3-line-stops-for-a-person-and-their-answer-carries-it-on"
text = "A V3 line whose author put a Wait node in it holds at that node as a durable state rather than as work in progress -- the run reads back as waiting, at that node, with the rail marking it as the one owing a person a move, and no later node is started while it holds, across the death and restart of the process that reached it. The answer is judged by the schema that node's own author pinned, so a value that schema refuses is named as no answer at all and leaves the run waiting for another, while an answer to a run that is not waiting is refused as the state conflict it is; the answer that is admitted is kept as the event's own bytes and carries the line on -- to the heir its author declared, or, where the Wait node is the line's sink, to the run's own terminal hash."

# OPEN, AND NAMED RATHER THAN NARROWED. V13 durably owns the run-configuration
# snapshot the public start writes. The package is still only the declared half:
# no owner materializes a `required_context` selector into ADR 0006's complete
# package.
#
# The live provider path still writes `AgentReceiptV2`. It does not connect that
# result to `NodeReceipt.agent_receipt_hash`, and `RunEvent.node_receipt_hash`
# does not yet carry the V3 receipt into the event chain. Those #110 links remain
# later work; this file neither calls the existing prelaunch NodeReceipt a live
# provider receipt nor claims a complete context package.
#
# The pause above adds two of its own, named here rather than implied by the
# sentence. A V3 run resource says it is WAITING_INPUT and names the node, and it
# does not restate what that node asks: the prompt and the answer schema belong
# to the document and are read from the workflow revision the run names. The run
# page now answers that wait through the existing POST /runs/{ref}/answers door.

[[sentence]]
id = "a-waiting-v3-run-is-answerable-on-its-run-page"
text = "A V3 run that is waiting for a person shows that wait's authored question on its own run page with an answer field; when the published document carries no question the card names that absence; submitting sends the exact bytes through POST /runs/{ref}/answers and a named refusal of that door stays on the card."

# RETIRED WITH THE CALLERLESS SUPERVISED DOOR. This file declared
# `a-supervised-v3-start-leaves-the-manifest-its-receipt-names` for a private
# start that wrote a receipt-named manifest in the same transaction as the run.
# That door had no production caller after the #216 seam collapse, and the public
# start does not write that manifest. The claim is open on the record family
# (#110), not proven here.

[[sentence]]
id = "a-v3-node-execution-request-is-composed-not-supplied"
text = "A node execution request and the context-package manifest it names are composed from the document and the frozen run configuration the run is bound to, never resolved a second time and never taken from a caller: a declared reference the frozen configuration does not carry is refused by its site rather than dropped, a configuration frozen for another revision is refused as another run's answer, a node declaring more revisions of one kind than the request can bind is refused by that count rather than bound in part, and the manifest hash covers the declared members in the order and under the selectors their author wrote."

# NARROWED WITH THE CALLERLESS SUPERVISED DOOR, SAME ID, AND CORRECTED HERE ON
# BOTH SIDES. Two things had drifted apart and the note itself was one of them.
#
# The text said "on the real start path". `bind_node_execution` has no
# production caller: the driver composes its own binding in the adapter, and
# this composition is the shape the interpreter is to be moved onto, which #86
# owns. Claiming a path it does not sit on was the false half, so the text now
# says what it is -- a composition, with its refusals -- and claims no caller.
#
# The note said "what remains is the snapshot the public start actually stores".
# That describes the sentence below it, not this one; what remains here is the
# composition and the manifest, which is exactly what the title always said.
# Both halves now agree with the proofs that claim them.

[[sentence]]
id = "a-supervised-v3-run-records-the-configuration-it-was-started-under"
text = "Every V3 run binds the exact run configuration it was started under, and the store keeps the preimage of that snapshot, immutable and reachable from the row that names it."
