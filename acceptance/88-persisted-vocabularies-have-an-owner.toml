schema_version = 1
story = "https://github.com/FlexOr2/atelier-2/issues/88"

# Four sentences. Residues named rather than quietly folded in:
#
#   - Hygiene-4, the page limit. Closed: `PageLimit` / `MAXIMUM_PAGE_ITEMS` is
#     the one owner; the event page, the HTTP `limit`, and the durable query
#     adapters derive that bound.
#   - H7's ownerless columns. Every CHECK over an owned vocabulary proves the
#     full admitted set through SQLite grammar; what remains is the handful of
#     columns with no Python owner at all (`runs.workflow_format_version`
#     among them), and minting those owners is a contract decision, not a
#     hygiene edit.
#   - M5, the predecessor control-frame strings. The direct-systemd Manager
#     foundation landed in PR #165, and #15 Slice 2 owns deletion of
#     `agent_process_watchdog.py`, `agent_processes.py`, their protocol, and their
#     proof. Giving condemned frames a new enum would preserve the predecessor;
#     the direct-systemd proofs rescued before deletion remain with #15.
#   - The cancel-token proof over query and SSE. Test-only, and it wants the
#     live-stream harness rather than the projection seam this head worked in.
#
# What the sentences below share is the shape of the defect: a number or a
# name written twice, agreeing today, with nothing red on the day they stop.
#
# THE "DERIVED EVERYWHERE" HALF WAS DECLARED BEFORE IT WAS PROVEN, and that is
# recorded here rather than repaired in silence. #204 bound 23 wire bounds to
# their owners, and the guards that hold them compared the *value*: a wire file
# could keep the number and lose the derivation -- `WIRE_BOUND = 1_024` beside
# `max_length=WIRE_BOUND`, or `max_length=512 * 2` -- and stay green. The bound
# was right and the sentence was not proven. The guard now reads the reference,
# so a bound that stops naming its owner is red whatever its value; the shapes
# that used to slip through are pinned against synthetic source so the guard's
# reach is a standing claim and not a reviewer's re-measurement.

[[sentence]]
id = "a-persisted-bound-is-written-once-and-derived-everywhere"
text = "A bound the product persists or admits at its edge is written once at the contract that owns it and derived everywhere else, so no schema check and no host constant can keep an old bound after the owner moves; a bound the schema may still spell for itself is named with the reason it has no owner."

[[sentence]]
id = "a-durable-id-keeps-the-exact-form-it-was-minted-in"
text = "The audited bootstrap, logical-effect, effect-workflow and reconcile-workflow identities are pinned as whole literal strings rather than only by their prefixes, so a changed digest, separator or encoding turns identical work into a second identity loudly instead of silently."

[[sentence]]
id = "the-v1-event-vocabulary-is-spelled-once-and-refuses-by-name"
text = "The set of event kinds a V1 run cannot carry has one owner that both the published schema and the projection read, so every unpublished kind is refused by name instead of leaving the closed union through a fall-through assertion."

[[sentence]]
id = "a-schema-check-cannot-silently-narrow-an-owned-vocabulary"
text = "Every SQLite CHECK that names a contract-owned persisted vocabulary is parsed under the SQLite dialect and preserves the complete owned member set; equality, reversed equality, positive or negative membership, inequality and Boolean nesting cannot silently remove a member, and an unrecognised predicate on that vocabulary fails the guard by name."
