schema_version = 1
story = "https://github.com/FlexOr2/atelier-2/issues/440"
# Room names revised on 26.08.2026 (#773, refs #698, #704), in the same act
# that carried this file's rule identifiers to their successors: ADR 0019
# retired the Board and the Workflows room, and the surfaces these sentences
# measure moved with them. Every sentence identifier stands unchanged -- the
# discipline #521 already used -- so no proof and no claim is renamed.

[[sentence]]
id = "the-studio-preserves-confirmed-truth-and-retries-only-its-failed-read"
requirement = "REQ-UIQ-10"
text = "The Workbench names an incomplete or unavailable three-list read without exposing transport trivia, preserves confirmed run truth, and offers one accessible Retry that repeats only that logical read until newly confirmed truth replaces the failure."

[[sentence]]
id = "new-run-preserves-workflow-truth-and-retries-only-the-workflow-read"
requirement = "REQ-UIQ-10"
text = "New Run confirms its complete saved-workflow list and every distinct authored name's catalog state only when each admitted catalog head is present under that name in the same listing; otherwise it names the read incomplete or unavailable without exposing transport trivia, preserves its last jointly confirmed picker rows, newest-head ordering, and catalog forms, and offers one accessible Retry that repeats only that logical GET set until newly confirmed truth replaces the failure."

[[sentence]]
id = "new-run-preserves-agent-and-draft-truth-and-retries-only-the-agent-read"
requirement = "REQ-UIQ-10"
text = "New Run confirms every published-agent page together or none, distinguishes an unavailable read from a confirmed empty list, preserves its last complete agent list and every current draft and expert value through refresh failure, and offers one accessible Retry that repeats only that agent-list GET set until newly confirmed truth replaces the failure."

[[sentence]]
id = "new-run-confirms-workflow-detail-before-committing-selection-and-draft"
requirement = "REQ-UIQ-10"
text = "New Run commits a saved workflow revision to its picker and draft only after the exact immutable revision-hash detail confirms, retains prior confirmed selection and draft across unavailable, mismatched, or stale responses, and offers one accessible Retry that repeats only the failed exact-detail GET; Details, Edit, and selection share that per-hash truth without refreshing a confirmed detail."
