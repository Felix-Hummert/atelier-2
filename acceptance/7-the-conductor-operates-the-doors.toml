schema_version = 1
story = "https://github.com/FlexOr2/atelier-2/issues/7"

# Phase B of the conductor (#7): the first executor whose tools reach the
# product's own API. Offline proofs only -- the billed conformance probe
# (door fires, built-ins stay imitation, no customization returns without
# safe mode) is a separate operator-gated step and is deliberately NOT a
# sentence here: no offline test may claim it.
#
# What is deliberately absent, and why:
#
#   - NO answer_wait, NO publish_artifact in the grant. The conductor chooses,
#     starts and observes; humans answer the waits of started runs.
#   - NO --safe-mode. Measured (spawn-detection, unbilled): safe mode prevents
#     any --mcp-config server from spawning, so it and a door cannot coexist.
#   - NO real-run sentence. A billed call under this vector has not been made;
#     routine use waits on the operator-gated probe.
#   - NO native structured-output sentence. The release fulfils --json-schema
#     with a synthetic StructuredOutput TOOL whose input_schema the API refuses
#     unless it is an object schema with no top-level allOf/anyOf/oneOf -- a
#     live 400 before any model started (#1188) -- so no vector here carries
#     the flag. The declared schema closes the job instead, and the answer is
#     judged at the output seam, which is what the two sentences below say.
#   - NO conductor-document sentence. Operator ruling 05.09.2026 (audit #1244
#     finding 10) deleted the loop{wait, agent} document's production
#     builder for want of a caller; the Workbench e2e proof now builds the
#     same shape as test-owned scenario data in tests/e2e/conductor_seed.py,
#     which carries no acceptance sentence of its own.

[[sentence]]
id = "the-doors-vector-admits-exactly-the-granted-doors"
text = "The Claude atelier-doors executor prepares an argument vector with no --safe-mode, --tools= removing every built-in, --allowedTools naming exactly the composed door tools under the mcp__<server>__<tool> grammar, and a strict single-server --mcp-config whose one server is the serving host's own atelier2 mcp door command."

[[sentence]]
id = "an-episode-answers-the-value-its-schema-declared"
text = "Ten identical episodes whose node declared the conductor report schema each hand on a value that schema admits, whatever prose the provider wrapped it in: bare, with a trailing newline, introduced by a sentence, or inside a Markdown fence."

[[sentence]]
id = "an-episode-answering-no-such-value-is-still-refused"
text = "An episode whose answer carries no value the declared schema admits hands that answer on unchanged, so the output seam refuses it by name rather than any narrowing accepting or repairing it."
