schema_version = 1
story = "https://github.com/FlexOr2/atelier-2/issues/111"

# THIS FILE HELD ONE HEAD THAT ONLY ANSWERED A NAME. IT NOW HOLDS TWO, AND THE
# SECOND RUNS WHAT THE FIRST ANSWERS.
#
# #111 wants one command to start a named workflow. The measured distance to that
# (comment 5310231752) is four doors, and this head opens the first: until now the
# catalog was reachable in-process only, so no name could be asked for over the
# API at all. What is deliberately absent, and why:
#
#   - NO RUN IS STARTED. The record-truth path needs a `NodeExecutionRequest`,
#     which needs a `context_package_hash` -- and `ContextPackage` is a contract
#     class no production code constructs or even imports. Filling it here would
#     author `context-package/v3` from a route, which is the forgery H1c refused
#     from the store side. That owner is its own head.
#   - NO CLI THAT RUNS. That head was `resolve`, not `run --name`: a `run` that
#     resolved without running would have been a verb that lies, and running is
#     what the record-truth owner blocked at the time.
#
# THAT BLOCK IS GONE, AND THE DOOR IS OPEN. A published V3 revision starts over
# HTTP and the runtime drives it to its terminal hash (#216, #219), so `run
# --name` can resolve and then actually run. The sentence below is that command:
# the deferral above is answered rather than left standing as a claim about a
# limit that no longer exists.
#
# The reading half of that sentence was true only for the older formats until
# #253. The service learned to answer with the format-3 event form (#249) and the
# command's decoder still knew V1 and V2, so the first live chain run printed
# nothing and ended unsuccessfully while the run itself completed cleanly on the
# server. The command refused honestly rather than misreading, which is why the
# repair is a wider union at the wire's own owner and not a second vocabulary in
# the host; a chain now carries the sentence end to end.
#
# ONE REFUSAL IS DECLARED WITHOUT A TEST, AND THAT IS SAID RATHER THAN HIDDEN.
# `catalog-revision-not-a-member` answers the case where a name resolves but the
# lineage does not admit the revision it resolved to. No sequence of store calls
# reaches it: the same write that admits a member is what makes the name resolve.
# It is the corrupt-store class #190 named -- so the route keeps the branch and
# the code stays declared, because the alternative is a route that meets a torn
# store and answers with an internal error instead of the reason. Reaching it in
# a test would mean writing a torn store by hand, which proves the fixture, not
# the code.

# #63 used to own an in-process "name reaches exactly the bytes it resolved to"
# sentence on a callerless supervised start. That door is gone. REQ-KATALOG-02
# is bound here, on the public name path: the API answers which revision a name
# holds, and `run --name` starts exactly those bytes. #22 owns how named
# revisions are listed.

[[sentence]]
id = "a-name-is-answerable-over-the-api"
text = "A caller who knows a catalog name, and nothing else, learns over the API which revision that name holds -- its lineage, its member number and the exact revision hash -- so a name no longer has to be translated into a hash by hand before the rest of the API can be used."
requirement = "REQ-KATALOG-02"

[[sentence]]
id = "a-name-the-catalog-cannot-honour-is-refused-by-its-own-reason"
text = "A name nobody admitted, a member position the lineage does not hold, a position that is not a number or head, and a revision its lineage does not admit are each refused with the reason that names them, and a retired lineage is refused as retired without disclosing the revision it once held."

[[sentence]]
id = "the-name-path-is-never-read-as-a-revision-hash"
text = "The path that answers a name is never claimed by the path that answers a revision hash, so a name is answered as a name instead of being refused as a malformed hash."

# THE COMMAND HALF, ADDED WITH `atelier2 resolve`. It asks the route above and
# adds no judgment of its own -- which is why it is a client of the product and
# not a second way into it, exactly as `run` documents about itself.

[[sentence]]
id = "one-command-answers-what-a-name-holds"
text = "An operator who knows a workflow name learns from one command which revision that name holds -- its lineage, its member number and the exact revision hash -- without publishing anything, starting anything, or translating a name into a hash by hand first."

[[sentence]]
id = "a-refused-name-ends-the-command-unsuccessfully"
text = "A name the service refuses ends the command unsuccessfully and in the service's own words, with nothing written to standard output, so a refusal can never be mistaken for an answer by a script or by an eye."

# WHAT THE COMMAND STILL DOES NOT DO, named rather than discovered:
#
#   - `--input` / `--input-file` now belong to #38 and travel with that item.
#     A named run carries the order the operator supplied; this file no longer
#     claims the flag is absent.
#   - NO ANSWERING A WAIT. A run that stops for a human ends the command
#     unsuccessfully and says which capability is missing; there is no form here.
#   - NO VERDICT EXIT CODE. Output contracts are #57. The exit code says whether
#     the run ended and was read whole, and nothing about whether its work was
#     good.

[[sentence]]
id = "one-command-runs-the-workflow-a-name-holds"
text = "One command runs the workflow a catalog name holds: the operator names it, the service is asked which revision that name holds before anything is written, the run starts on exactly that revision without republishing it, and the command waits for the run to end -- printing the run's own output on standard output and, on standard error, the name it resolved together with the run, its revision and its terminal hash."
requirement = "REQ-KATALOG-02"
