schema_version = 1
story = "https://github.com/FlexOr2/atelier-2/issues/224"

# The last pane of glass. #216 made a V3 line drive itself and #219 made it
# answer over HTTP; until this head the cockpit threw when asked to draw one,
# because `executableGraph` refuses a V3 graph and the wire carries no nodes for
# it.
#
# WHAT THIS HEAD DOES NOT CLAIM, and why each is absent rather than unfinished:
#
#   - NO GRAPH DRAWING. The wire gives a V3 revision a node count, not nodes, so
#     there is nothing to draw a shape from. What is shown is the rail the server
#     already walked, which is the run's real path; the drawing needs a V3 node
#     shape in the wire and is its own head.
#   - LIVE FOLLOWING ARRIVED, AND THIS SENTENCE GAVE UP A CLAUSE FOR IT (#270).
#     The clause below used to end "and the page tells the operator that it is
#     not following the run live rather than implying that it is." That was true
#     and worth pinning while no format-3 event existed. #249 put one on the
#     wire, so the honest thing became the opposite: a page that declined to
#     follow would now be withholding what it can read. The clause is therefore
#     replaced rather than narrowed -- the page follows, and #270 declares what
#     it must show while it does.
#   - THE PICKER NOW STARTS ONE, and the sentence below says so. It was named
#     absent here while the cockpit could not draw a V3 run; it can, so the gate
#     fell. What the picker needed was never the nodes -- it was the roles, which
#     the revision resource now answers with.
#   - NO WAIT OR RECONCILE FORMS. A V3 run cannot reach those states, because no
#     runtime interprets a Wait or Action node in the format yet.
#
# The rail is rendered rather than recomputed. The browser folds a V1 or V2 rail
# itself because its events arrive one at a time; a V3 run carries the rail the
# server walked, and a second derivation here would be a second owner of the same
# order -- one that could not walk a V3 graph in any case.

[[sentence]]
id = "a-v3-run-is-visible-in-the-cockpit"
text = "An operator who opens a V3 run by its address sees the line its author declared -- every node in the order the run walks them, which one has finished and which is running now -- together with where the run stands and, once it has ended, the terminal hash it closed on."

# WHAT THE PICKER STILL DOES NOT DO. The graph is not drawn: a version 3 revision
# answers with its roles and its node count, not its nodes, so there is no shape
# to render and none is invented. Live following stays absent because this page
# does not subscribe; the HTTP event resource is no longer the reason.

[[sentence]]
id = "a-v3-workflow-is-started-from-the-picker"
text = "An operator who publishes a V3 workflow is offered exactly the agent roles that document declares -- learnt from the API rather than by re-reading the YAML -- and binding them starts the run through the same bound request a V2 workflow uses, landing the operator on the run they just began."
