schema_version = 1
story = "https://github.com/FlexOr2/atelier-2/issues/572"

# A visible difference in click-and-glance budget is the whole point (#553's
# named second step): a boolean or enum wait gate can be answered without
# leaving the Board, through the exact audited POST path the run page's own
# composer already sends through -- one shared delivery module, not a second
# implementation. A gate this surface cannot classify carries no such budget
# to claim, so it says plainly that it needs a written answer instead.

[[sentence]]
id = "a-boolean-board-card-answers-inline"
requirement = "REQ-UIQ-02"
text = "An operator who opens a boolean or enum wait gate's card on the Board answers it there in two clicks -- Answer here, then the decision -- through the run page's own audited answer path, and sees the card's own move out of Needs You as the confirmation, at both desktop and phone width."

[[sentence]]
id = "a-free-text-board-card-links-to-the-run-page"
requirement = "REQ-UIQ-07"
text = "An operator who opens a free-text wait gate's card on the Board is told plainly that it needs a written answer and is led to the run page to give one, never offered decision buttons the card cannot honestly back, at both desktop and phone width."
