format_version: 3
name: code-review
description: >-
  One headless agent reviews a diff from durable evidence and answers the
  review questions supplied with the run. Its structured result records each
  finding's location and severity alongside the review verdict.
graph_inputs:
  - name: diff
    schema:
      ref: diff_review_diff
      revision: "efee11cebb880d0df169aab4de57cc50901261b5e17328a62faa26f442173f95"
  - name: review_questions
    schema:
      ref: nonempty_string
      revision: "efee11cebb880d0df169aab4de57cc50901261b5e17328a62faa26f442173f95"
nodes:
  - id: review
    type: agent
    role: reviewer
    mode: headless
    instruction: >-
      Review the diff carried under "diff" and answer the questions carried
      under "review_questions". You cannot read files, run anything, or use
      tools in this headless call; the diff and questions are your only
      evidence. Approve the diff when nothing you find blocks it; otherwise
      revise it. Revise only with at least one finding; cannot-judge must
      carry a reason.
    inputs:
      - name: diff
        from:
          graph_input: diff
      - name: review_questions
        from:
          graph_input: review_questions
    outputs:
      - name: result
        schema:
          ref: code_review_result
          revision: "19cec6b7aac1f66a82c831b9c895b8344dd4483a05a4e33515737112c2fe93ba"
