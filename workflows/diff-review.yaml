format_version: 3
name: diff-review
description: >-
  One headless agent reviews a diff it is handed. The review artifact is a
  structured list of findings and the product's verdict vocabulary; the schema
  owns that contract rather than the prompt.
graph_inputs:
  - name: diff
    schema:
      ref: diff_review_diff
      revision: "efee11cebb880d0df169aab4de57cc50901261b5e17328a62faa26f442173f95"
nodes:
  - id: review
    type: agent
    role: reviewer
    mode: headless
    instruction: >-
      Review the diff carried under "diff". You cannot read files, run
      anything, or use tools in this headless call; the diff text is your only
      evidence. Accept the diff when nothing you find blocks it; otherwise
      revise it.
    inputs:
      - name: diff
        from:
          graph_input: diff
    outputs:
      - name: finding
        schema:
          ref: diff_review_finding
          revision: "6caef83845ecfe5d9922d2c9b6662bcf3ec298bff81c9af4eb6a6f345c9fae14"
