# it on this agent node before the local runner admits the workflow.
format_version: 3
name: provider-canary-atelier-doors
description: >-
  Proves that the configured atelier-doors vector can reach the workshop's
  read-only workflow catalog door.
nodes:
  - id: probe
    type: agent
    role: provider-canary
    mode: headless_with_tools
    instruction: >-
      Call the atelier door list_workflows exactly once. Start no workflow and
      call no other door. After the door answers, respond with exactly the JSON
      string "canary-alive" and no other text.
    outputs:
      - name: result
        schema:
          ref: nonempty_string
          revision: "efee11cebb880d0df169aab4de57cc50901261b5e17328a62faa26f442173f95"
