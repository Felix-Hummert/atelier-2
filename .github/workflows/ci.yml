name: CI

on:
  pull_request:
    branches:
      - main
      - "integration/**"
      - "fable/**"
      - "agent/**"
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: "Cockpit: types, lint, tests, e2e"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Select Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install uv and select Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12.3"
          version: "0.10.9"

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Check frontend types
        run: npm run check

      - name: Lint frontend source
        run: npm run lint

      - name: Test frontend behavior
        run: npm test -- --reporter=default --reporter=json --outputFile=../reports/frontend.vitest.json

      - name: Upload the cockpit run report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-report-frontend-${{ github.run_attempt }}
          path: reports/frontend.vitest.json
          if-no-files-found: error
          retention-days: 7

      - name: Build the production cockpit
        run: npm run build

      - name: Install locked backend dependencies
        working-directory: .
        run: uv sync --locked --all-groups

      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Test the production cockpit in Chromium
        run: |
          set -euo pipefail
          unit="atelier2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-frontend"
          cleanup() {
            status="$1"
            trap - EXIT INT TERM
            sudo systemctl stop "${unit}.service" >/dev/null 2>&1 || true
            sudo systemctl reset-failed "${unit}.service" >/dev/null 2>&1 || true
            exit "${status}"
          }
          trap 'cleanup "$?"' EXIT
          trap 'cleanup 130' INT
          trap 'cleanup 143' TERM
          npm_path="$(command -v npm)"
          sudo systemd-run --quiet --wait --collect --pipe \
            --unit="${unit}" \
            --uid="$(id -u)" \
            --gid="$(id -g)" \
            --property=Type=exec \
            --property=Delegate=yes \
            --property=DelegateSubgroup=workload \
            --property=KillMode=control-group \
            --property=TimeoutStopSec=15s \
            --working-directory="${GITHUB_WORKSPACE}/frontend" \
            --setenv=HOME="${HOME}" \
            --setenv=PATH="${PATH}" \
            --setenv=CI="${CI:-true}" \
            --setenv=GITHUB_ACTIONS="${GITHUB_ACTIONS:-true}" \
            --setenv=GITHUB_WORKSPACE="${GITHUB_WORKSPACE}" \
            --setenv=UV_PYTHON="${UV_PYTHON}" \
            --setenv=UV_PYTHON_INSTALL_DIR="${UV_PYTHON_INSTALL_DIR}" \
            --setenv=UV_CACHE_DIR="${UV_CACHE_DIR}" \
            "${npm_path}" run e2e


  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out the event commit with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pinned gitleaks
        # The gitleaks-action wrapper requires an organization license key;
        # the MIT-licensed binary itself does not, so it is fetched directly
        # and verified against the release checksum.
        run: |
          curl -sSLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan the full history for secrets
        run: ./gitleaks git --redact --no-banner .

  quality:
    name: "Python: architecture, lint, types, tests"
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv and select Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12.3"
          version: "0.10.9"

      - name: Verify the dependency lock
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Prepare the disposable user manager and trace tool
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes strace
          uid="$(id -u)"
          state="${RUNNER_TEMP}/atelier2-user-manager-state"
          linger="$(loginctl show-user "${uid}" --property=Linger --value)"
          active="$(systemctl is-active "user@${uid}.service" || true)"
          printf '%s\n%s\n' "${linger}" "${active}" > "${state}"
          sudo loginctl enable-linger "${uid}"
          sudo systemctl start "user@${uid}.service"
          test -S "/run/user/${uid}/bus"
          printf 'XDG_RUNTIME_DIR=/run/user/%s\n' "${uid}" >> "${GITHUB_ENV}"
          printf 'DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/%s/bus\n' "${uid}" >> "${GITHUB_ENV}"
          manifest="${RUNNER_TEMP}/atelier2-units-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -m 0600 /dev/null "${manifest}"
          printf 'ATELIER2_SYSTEMD_UNIT_MANIFEST=%s\n' "${manifest}" >> "${GITHUB_ENV}"
          env -i \
            LC_ALL=C SYSTEMD_COLORS=0 SYSTEMD_URLIFY=0 \
            XDG_RUNTIME_DIR="/run/user/${uid}" \
            systemctl --user is-system-running

      - name: Check architecture contracts
        run: uv run --locked python scripts/check_architecture.py

      - name: Check source
        run: uv run --locked ruff check .

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Check types
        run: uv run --locked pyright src tests scripts

      - name: Test non-crash behavior
        run: |
          set -euo pipefail
          unit="atelier2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-quality"
          cleanup() {
            status="$1"
            trap - EXIT INT TERM
            sudo systemctl stop "${unit}.service" >/dev/null 2>&1 || true
            sudo systemctl reset-failed "${unit}.service" >/dev/null 2>&1 || true
            exit "${status}"
          }
          trap 'cleanup "$?"' EXIT
          trap 'cleanup 130' INT
          trap 'cleanup 143' TERM
          uv_path="$(command -v uv)"
          sudo systemd-run --quiet --wait --collect --pipe \
            --unit="${unit}" \
            --uid="$(id -u)" \
            --gid="$(id -g)" \
            --property=Type=exec \
            --property=Delegate=yes \
            --property=DelegateSubgroup=workload \
            --property=KillMode=control-group \
            --property=TimeoutStopSec=15s \
            --working-directory="${GITHUB_WORKSPACE}" \
            --setenv=HOME="${HOME}" \
            --setenv=PATH="${PATH}" \
            --setenv=CI="${CI:-true}" \
            --setenv=GITHUB_ACTIONS="${GITHUB_ACTIONS:-true}" \
            --setenv=GITHUB_WORKSPACE="${GITHUB_WORKSPACE}" \
            --setenv=UV_PYTHON="${UV_PYTHON}" \
            --setenv=UV_PYTHON_INSTALL_DIR="${UV_PYTHON_INSTALL_DIR}" \
            --setenv=UV_CACHE_DIR="${UV_CACHE_DIR}" \
            --setenv=XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR}" \
            --setenv=DBUS_SESSION_BUS_ADDRESS="${DBUS_SESSION_BUS_ADDRESS}" \
            --setenv=ATELIER2_SYSTEMD_UNIT_MANIFEST="${ATELIER2_SYSTEMD_UNIT_MANIFEST}" \
            "${uv_path}" run --locked pytest --dist loadgroup -n auto \
              --ignore=tests/crash tests -q \
              --junitxml="${GITHUB_WORKSPACE}/reports/quality.junit.xml"

      - name: Test user-manager restart recovery last and alone
        run: |
          set -euo pipefail
          unit="atelier2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-manager-restart"
          cleanup() {
            status="$1"
            trap - EXIT INT TERM
            sudo systemctl stop "${unit}.service" >/dev/null 2>&1 || true
            sudo systemctl reset-failed "${unit}.service" >/dev/null 2>&1 || true
            exit "${status}"
          }
          trap 'cleanup "$?"' EXIT
          trap 'cleanup 130' INT
          trap 'cleanup 143' TERM
          uv_path="$(command -v uv)"
          sudo systemd-run --quiet --wait --collect --pipe \
            --unit="${unit}" \
            --uid="$(id -u)" \
            --gid="$(id -g)" \
            --property=Type=exec \
            --property=Delegate=yes \
            --property=DelegateSubgroup=workload \
            --property=KillMode=control-group \
            --property=TimeoutStopSec=30s \
            --working-directory="${GITHUB_WORKSPACE}" \
            --setenv=HOME="${HOME}" \
            --setenv=PATH="${PATH}" \
            --setenv=CI="${CI:-true}" \
            --setenv=GITHUB_ACTIONS="${GITHUB_ACTIONS:-true}" \
            --setenv=GITHUB_WORKSPACE="${GITHUB_WORKSPACE}" \
            --setenv=UV_PYTHON="${UV_PYTHON}" \
            --setenv=UV_PYTHON_INSTALL_DIR="${UV_PYTHON_INSTALL_DIR}" \
            --setenv=UV_CACHE_DIR="${UV_CACHE_DIR}" \
            --setenv=XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR}" \
            --setenv=DBUS_SESSION_BUS_ADDRESS="${DBUS_SESSION_BUS_ADDRESS}" \
            --setenv=ATELIER2_SYSTEMD_UNIT_MANIFEST="${ATELIER2_SYSTEMD_UNIT_MANIFEST}" \
            --setenv=ATELIER2_ALLOW_USER_MANAGER_RESTART=1 \
            "${uv_path}" run --locked pytest -n 0 -q \
              tests/systemd/test_direct_systemd_lifecycle.py::test_user_manager_restart_preserves_each_durable_recovery_state

      - name: Upload the quality run report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-report-quality-${{ github.run_attempt }}
          path: reports/quality.junit.xml
          if-no-files-found: error
          retention-days: 7

      - name: Restore the runner user-manager state
        if: ${{ always() }}
        run: |
          set -uo pipefail
          uid="$(id -u)"
          state="${RUNNER_TEMP}/atelier2-user-manager-state"
          if [[ ! -f "${state}" ]]; then
            exit 0
          fi
          mapfile -t previous < "${state}"
          cleanup_status=0
          if ! sudo systemctl start "user@${uid}.service"; then
            cleanup_status=1
          fi
          manifest="${ATELIER2_SYSTEMD_UNIT_MANIFEST:-}"
          if [[ -n "${manifest}" && -f "${manifest}" ]]; then
            mapfile -t units < <(sort -u "${manifest}")
            for unit in "${units[@]}"; do
              if [[ ! "${unit}" =~ ^atelier2-agent-[0-9a-f]{64}\.service$ ]]; then
                echo "refusing malformed direct-systemd unit manifest entry: ${unit}" >&2
                cleanup_status=1
                continue
              fi
              timeout 10 systemctl --user stop "${unit}" >/dev/null 2>&1 || true
              timeout 10 systemctl --user reset-failed "${unit}" >/dev/null 2>&1 || true
              state_deadline=$((SECONDS + 10))
              while [[ "$(timeout 3 systemctl --user show "${unit}" --property=LoadState --value 2>/dev/null || true)" != "not-found" ]]; do
                if (( SECONDS >= state_deadline )); then
                  echo "direct-systemd unit remained after cleanup: ${unit}" >&2
                  cleanup_status=1
                  break
                fi
                sleep 0.1
              done
            done
          fi
          if [[ "${previous[1]}" != "active" ]]; then
            sudo systemctl stop "user@${uid}.service" || cleanup_status=1
          else
            sudo systemctl start "user@${uid}.service" || cleanup_status=1
          fi
          if [[ "${previous[0]}" != "yes" ]]; then
            sudo loginctl disable-linger "${uid}" || cleanup_status=1
          else
            sudo loginctl enable-linger "${uid}" || cleanup_status=1
          fi
          exit "${cleanup_status}"

  crash-recovery:
    name: Crash recovery
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv and select Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12.3"
          version: "0.10.9"

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Test crash-recovery behavior
        run: |
          set -euo pipefail
          unit="atelier2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-crash"
          cleanup() {
            status="$1"
            trap - EXIT INT TERM
            sudo systemctl stop "${unit}.service" >/dev/null 2>&1 || true
            sudo systemctl reset-failed "${unit}.service" >/dev/null 2>&1 || true
            exit "${status}"
          }
          trap 'cleanup "$?"' EXIT
          trap 'cleanup 130' INT
          trap 'cleanup 143' TERM
          uv_path="$(command -v uv)"
          sudo systemd-run --quiet --wait --collect --pipe \
            --unit="${unit}" \
            --uid="$(id -u)" \
            --gid="$(id -g)" \
            --property=Type=exec \
            --property=Delegate=yes \
            --property=DelegateSubgroup=workload \
            --property=KillMode=control-group \
            --property=TimeoutStopSec=15s \
            --working-directory="${GITHUB_WORKSPACE}" \
            --setenv=HOME="${HOME}" \
            --setenv=PATH="${PATH}" \
            --setenv=CI="${CI:-true}" \
            --setenv=GITHUB_ACTIONS="${GITHUB_ACTIONS:-true}" \
            --setenv=GITHUB_WORKSPACE="${GITHUB_WORKSPACE}" \
            --setenv=UV_PYTHON="${UV_PYTHON}" \
            --setenv=UV_PYTHON_INSTALL_DIR="${UV_PYTHON_INSTALL_DIR}" \
            --setenv=UV_CACHE_DIR="${UV_CACHE_DIR}" \
            "${uv_path}" run --locked pytest -n auto tests/crash -q \
              --junitxml="${GITHUB_WORKSPACE}/reports/crash.junit.xml"

      - name: Upload the crash-recovery run report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-report-crash-${{ github.run_attempt }}
          path: reports/crash.junit.xml
          if-no-files-found: error
          retention-days: 7

  acceptance:
    name: Acceptance trace
    needs: [frontend, quality, crash-recovery]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv and select Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12.3"
          version: "0.10.9"

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Download the run reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: acceptance-report-*-${{ github.run_attempt }}
          path: reports
          merge-multiple: true

      # The body is authored by whoever opened the pull request, so it reaches the
      # gate as a file through the environment and never as text substituted into
      # a shell script.
      - name: Record the acceptance binding the pull request states
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PULL_REQUEST_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PULL_REQUEST_BODY" > pull-request-body.md

      - name: Check the acceptance trace of the proposed landing
        if: ${{ github.event_name == 'pull_request' }}
        run: >-
          uv run --locked python scripts/check_acceptance.py --reports reports
          --pull-request-body pull-request-body.md

      - name: Check the acceptance trace of a landed commit
        if: ${{ github.event_name != 'pull_request' }}
        run: uv run --locked python scripts/check_acceptance.py --reports reports

  # Ruleset main-protection still requires the old check names. These jobs
  # publish those names after the renamed surfaces finish, and fail unless
  # the real job succeeded. Drop them when the required contexts flip.
  static-and-behavior:
    name: Static and behavior
    needs: quality
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Hold the required check name
        run: test "${{ needs.quality.result }}" = "success"

  cockpit-static-and-behavior:
    name: Cockpit static and behavior
    needs: frontend
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Hold the required check name
        run: test "${{ needs.frontend.result }}" = "success"
