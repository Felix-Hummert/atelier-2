name: CI

on:
  pull_request:
    branches:
      - main
      - "integration/**"
      - "fable/**"
      - "agent/**"
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Cockpit static and behavior
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Select Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install uv and select Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12.3"
          version: "0.10.9"

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Check frontend types
        run: npm run check

      - name: Lint frontend source
        run: npm run lint

      - name: Test frontend behavior
        run: npm test -- --reporter=default --reporter=json --outputFile=../reports/frontend.vitest.json

      - name: Upload the cockpit run report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-report-frontend-${{ github.run_attempt }}
          path: reports/frontend.vitest.json
          if-no-files-found: error
          retention-days: 7

      - name: Build the production cockpit
        run: npm run build

      - name: Install locked backend dependencies
        working-directory: .
        run: uv sync --locked --all-groups

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Test the production cockpit in Chromium
        run: |
          set -euo pipefail
          unit="atelier2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-frontend"
          cleanup() {
            status="$1"
            trap - EXIT INT TERM
            sudo systemctl stop "${unit}.service" >/dev/null 2>&1 || true
            sudo systemctl reset-failed "${unit}.service" >/dev/null 2>&1 || true
            exit "${status}"
          }
          trap 'cleanup "$?"' EXIT
          trap 'cleanup 130' INT
          trap 'cleanup 143' TERM
          npm_path="$(command -v npm)"
          sudo systemd-run --quiet --wait --collect --pipe \
            --unit="${unit}" \
            --uid="$(id -u)" \
            --gid="$(id -g)" \
            --property=Type=exec \
            --property=Delegate=yes \
            --property=DelegateSubgroup=workload \
            --property=KillMode=control-group \
            --property=TimeoutStopSec=15s \
            --working-directory="${GITHUB_WORKSPACE}/frontend" \
            --setenv=HOME="${HOME}" \
            --setenv=PATH="${PATH}" \
            --setenv=CI="${CI:-true}" \
            --setenv=GITHUB_ACTIONS="${GITHUB_ACTIONS:-true}" \
            --setenv=GITHUB_WORKSPACE="${GITHUB_WORKSPACE}" \
            --setenv=UV_PYTHON="${UV_PYTHON}" \
            --setenv=UV_PYTHON_INSTALL_DIR="${UV_PYTHON_INSTALL_DIR}" \
            --setenv=UV_CACHE_DIR="${UV_CACHE_DIR}" \
            "${npm_path}" run e2e

  quality:
    name: Static and behavior
    runs-on: ubuntu-latest
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv and select Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12.3"
          version: "0.10.9"

      - name: Verify the dependency lock
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Check architecture contracts
        run: uv run --locked python scripts/check_architecture.py

      - name: Check source
        run: uv run --locked ruff check .

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Check types
        run: uv run --locked pyright src tests scripts

      - name: Test non-crash behavior
        run: |
          set -euo pipefail
          unit="atelier2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-quality"
          cleanup() {
            status="$1"
            trap - EXIT INT TERM
            sudo systemctl stop "${unit}.service" >/dev/null 2>&1 || true
            sudo systemctl reset-failed "${unit}.service" >/dev/null 2>&1 || true
            exit "${status}"
          }
          trap 'cleanup "$?"' EXIT
          trap 'cleanup 130' INT
          trap 'cleanup 143' TERM
          uv_path="$(command -v uv)"
          sudo systemd-run --quiet --wait --collect --pipe \
            --unit="${unit}" \
            --uid="$(id -u)" \
            --gid="$(id -g)" \
            --property=Type=exec \
            --property=Delegate=yes \
            --property=DelegateSubgroup=workload \
            --property=KillMode=control-group \
            --property=TimeoutStopSec=15s \
            --working-directory="${GITHUB_WORKSPACE}" \
            --setenv=HOME="${HOME}" \
            --setenv=PATH="${PATH}" \
            --setenv=CI="${CI:-true}" \
            --setenv=GITHUB_ACTIONS="${GITHUB_ACTIONS:-true}" \
            --setenv=GITHUB_WORKSPACE="${GITHUB_WORKSPACE}" \
            --setenv=UV_PYTHON="${UV_PYTHON}" \
            --setenv=UV_PYTHON_INSTALL_DIR="${UV_PYTHON_INSTALL_DIR}" \
            --setenv=UV_CACHE_DIR="${UV_CACHE_DIR}" \
            "${uv_path}" run --locked pytest -n auto --ignore=tests/crash tests -q \
              --junitxml="${GITHUB_WORKSPACE}/reports/quality.junit.xml"

      - name: Upload the quality run report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-report-quality-${{ github.run_attempt }}
          path: reports/quality.junit.xml
          if-no-files-found: error
          retention-days: 7

  crash-recovery:
    name: Crash recovery
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv and select Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12.3"
          version: "0.10.9"

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Test crash-recovery behavior
        run: |
          set -euo pipefail
          unit="atelier2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-crash"
          cleanup() {
            status="$1"
            trap - EXIT INT TERM
            sudo systemctl stop "${unit}.service" >/dev/null 2>&1 || true
            sudo systemctl reset-failed "${unit}.service" >/dev/null 2>&1 || true
            exit "${status}"
          }
          trap 'cleanup "$?"' EXIT
          trap 'cleanup 130' INT
          trap 'cleanup 143' TERM
          uv_path="$(command -v uv)"
          sudo systemd-run --quiet --wait --collect --pipe \
            --unit="${unit}" \
            --uid="$(id -u)" \
            --gid="$(id -g)" \
            --property=Type=exec \
            --property=Delegate=yes \
            --property=DelegateSubgroup=workload \
            --property=KillMode=control-group \
            --property=TimeoutStopSec=15s \
            --working-directory="${GITHUB_WORKSPACE}" \
            --setenv=HOME="${HOME}" \
            --setenv=PATH="${PATH}" \
            --setenv=CI="${CI:-true}" \
            --setenv=GITHUB_ACTIONS="${GITHUB_ACTIONS:-true}" \
            --setenv=GITHUB_WORKSPACE="${GITHUB_WORKSPACE}" \
            --setenv=UV_PYTHON="${UV_PYTHON}" \
            --setenv=UV_PYTHON_INSTALL_DIR="${UV_PYTHON_INSTALL_DIR}" \
            --setenv=UV_CACHE_DIR="${UV_CACHE_DIR}" \
            "${uv_path}" run --locked pytest -n auto tests/crash -q \
              --junitxml="${GITHUB_WORKSPACE}/reports/crash.junit.xml"

      - name: Upload the crash-recovery run report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-report-crash-${{ github.run_attempt }}
          path: reports/crash.junit.xml
          if-no-files-found: error
          retention-days: 7

  acceptance:
    name: Acceptance trace
    needs: [frontend, quality, crash-recovery]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv and select Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12.3"
          version: "0.10.9"

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Download the run reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: acceptance-report-*-${{ github.run_attempt }}
          path: reports
          merge-multiple: true

      # The body is authored by whoever opened the pull request, so it reaches the
      # gate as a file through the environment and never as text substituted into
      # a shell script.
      - name: Record the acceptance binding the pull request states
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PULL_REQUEST_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PULL_REQUEST_BODY" > pull-request-body.md

      - name: Check the acceptance trace of the proposed landing
        if: ${{ github.event_name == 'pull_request' }}
        run: >-
          uv run --locked python scripts/check_acceptance.py --reports reports
          --pull-request-body pull-request-body.md

      - name: Check the acceptance trace of a landed commit
        if: ${{ github.event_name != 'pull_request' }}
        run: uv run --locked python scripts/check_acceptance.py --reports reports
